<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMRS Allam Medica</title>
<!-- Fase 2: klien Supabase (menggantikan Google Apps Script). Pin versi 2.x supaya stabil. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{
    --ink:#12242b;
    --paper:#f4f7f6;
    --panel:#ffffff;
    --line:#dde5e3;
    --teal:#0d6e6e;
    --teal-dk:#095454;
    --teal-lt:#e4f2f1;
    --amber:#b5762a;
    --amber-lt:#fbeee0;
    --red:#b3392c;
    --red-lt:#fbe9e6;
    --muted:#5c7370;
    --radius:10px;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);}
  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .side{width:220px;background:var(--teal-dk);color:#eafaf7;flex-shrink:0;display:flex;flex-direction:column;}
  .side .brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.12);}
  .side .brand b{font-size:15px;letter-spacing:.3px;display:block;}
  .side .brand span{font-size:11px;opacity:.7;}
  .nav{padding:10px 0;flex:1;overflow-y:auto;}
  .nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:#cfe9e6;padding:10px 18px;font-size:13.5px;cursor:pointer;border-left:3px solid transparent;}
  .nav button:hover{background:rgba(255,255,255,.06);}
  .nav button.active{background:rgba(255,255,255,.1);border-left-color:#5fd0c4;color:#fff;font-weight:600;}
  .nav .step{font-size:10px;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  /* Main */
  .main{flex:1;padding:22px 28px;max-width:1180px;}
  h1{font-size:19px;margin:0 0 3px;}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 18px;}
  .grid{display:grid;gap:14px;}
  .grid.cols4{grid-template-columns:repeat(4,1fr);}
  .grid.cols2{grid-template-columns:1fr 1fr;}
  .grid.cols3{grid-template-columns:repeat(3,1fr);}
  @media(max-width:900px){.grid.cols4,.grid.cols3,.grid.cols2{grid-template-columns:1fr;}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .stat b{font-size:24px;display:block;}
  .stat span{font-size:11.5px;color:var(--muted);}

  label{font-size:11.5px;color:var(--muted);display:block;margin:8px 0 3px;}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;background:#fff;color:var(--ink);font-family:inherit;}
  textarea{resize:vertical;min-height:60px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:150px;}

  button.btn{background:var(--teal);color:#fff;border:none;padding:9px 16px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;}
  button.btn:hover{background:var(--teal-dk);}
  button.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal);}
  button.btn.danger{background:var(--red);}
  button.btn.sm{padding:5px 10px;font-size:12px;}

  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;}
  tr:hover td{background:var(--teal-lt);}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .badge.ok{background:var(--teal-lt);color:var(--teal-dk);}
  .badge.warn{background:var(--amber-lt);color:var(--amber);}
  .badge.danger{background:var(--red-lt);color:var(--red);}
  .badge.muted{background:#eef1f0;color:var(--muted);}

  .section-title{font-size:13.5px;font-weight:700;margin:18px 0 8px;color:var(--teal-dk);border-bottom:2px solid var(--teal-lt);padding-bottom:6px;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:99;}
  .toast.show{opacity:1;transform:translateY(0);}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .patient-strip{background:var(--teal-lt);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;display:flex;gap:20px;flex-wrap:wrap;}
  .patient-strip b{color:var(--teal-dk);}
  .empty{color:var(--muted);text-align:center;padding:30px 0;font-size:13px;}
  .cbg-result{border:2px dashed var(--teal);border-radius:10px;padding:16px;background:var(--teal-lt);}
  .cbg-result b.code{font-size:22px;color:var(--teal-dk);}
  .flag-item{padding:8px 10px;border-radius:7px;font-size:12.5px;margin-bottom:6px;}
  .flag-item.warn{background:var(--amber-lt);color:#7a4d16;}
  .config-note{background:var(--amber-lt);border:1px solid var(--amber);color:#7a4d16;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:14px;}
  .suggest-box{position:absolute;z-index:20;background:#fff;border:1px solid var(--line);border-radius:8px;max-height:220px;overflow-y:auto;width:100%;box-shadow:0 6px 18px rgba(0,0,0,.1);display:none;}
  .suggest-box.show{display:block;}
  .suggest-item{padding:8px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line);}
  .suggest-item:last-child{border-bottom:none;}
  .suggest-item:hover{background:var(--teal-lt);}
  .suggest-item b{color:var(--teal-dk);}

  /* Login screen */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--teal-dk),var(--teal) 65%,#0a4a4a);}
  .login-card{background:#fff;border-radius:14px;padding:34px 32px;width:340px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .login-card h1{font-size:18px;margin:0 0 2px;color:var(--teal-dk);}
  .login-card p{font-size:12px;color:var(--muted);margin:0 0 20px;}
  .login-card button{width:100%;margin-top:14px;}
  .login-err{color:var(--red);font-size:12.5px;margin-top:8px;min-height:16px;}
  .user-box{padding:12px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;}
  .user-box b{display:block;font-size:13px;}
  .user-box .role-tag{display:inline-block;background:rgba(255,255,255,.15);border-radius:20px;padding:1px 8px;font-size:10px;margin-top:3px;}
  .user-box button{background:none;border:1px solid rgba(255,255,255,.3);color:#cfe9e6;font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;margin-top:8px;}
  .user-box button:hover{background:rgba(255,255,255,.1);}
  @media print{
    .side, .toast, .config-note, button.btn{display:none !important;}
    .main{max-width:100%;padding:0;}
    body{background:#fff;}
  }
  .resep-print{border:1px solid var(--line);border-radius:10px;padding:20px;background:#fff;}
  .resep-print h2{margin:0 0 4px;font-size:16px;}
  .resep-print .sub2{color:var(--muted);font-size:11.5px;margin-bottom:14px;}
  .resep-print table{margin-top:8px;}
  .resep-print .total-row td{font-weight:700;border-top:2px solid var(--ink);}
.triase-Merah { border-left:5px solid #c0392b; background:#fdecea; }
.triase-Kuning { border-left:5px solid #e0a800; background:#fff8e6; }
.triase-Hijau { border-left:5px solid #27ae60; background:#eafaf1; }
.triase-Hitam { border-left:5px solid #2c3e50; background:#ecf0f1; }
.triase-badge { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600; color:#fff; }
.badge-Merah { background:#c0392b; }
.badge-Kuning { background:#e0a800; }
.badge-Hijau { background:#27ae60; }
.badge-Hitam { background:#2c3e50; }
.igd-card { border-radius:8px; padding:10px 14px; margin-bottom:8px; cursor:pointer; }
.igd-card:hover { filter:brightness(0.97); }
.vital-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
</style>
</head>
<body>
<div id="app" class="app">

  <div class="side">
    <div class="brand"><b>SIMRS Allam Medica</b><span>Pendaftaran → Pulang + INA-CBG</span></div>
    <div class="nav" id="nav"></div>

  </div>

  <div class="main" id="main"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= KONFIGURASI SUPABASE (Fase 2) ================= */
// GANTI dengan URL & anon key project Supabase Anda: Project Settings -> API.
// anon key AMAN ditaruh di frontend (bukan rahasia) — akses sesungguhnya
// tetap dijaga oleh Row Level Security di database, bukan oleh key ini.
const SUPABASE_URL = "https://cduhicndsaeuxstpxthh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkdWhpY25kc2FldXhzdHB4dGhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MjE5MzMsImV4cCI6MjEwNDA5NzkzM30.oBEx-UxyglaQykDpzeZTCDNQXU5x-mQRQjZNlx3SXBM";
const DEMO_MODE = SUPABASE_URL.indexOf("http") !== 0; // true selama URL belum diisi -> pakai data lokal simulasi (tanpa backend nyata)
const supabase = DEMO_MODE ? null : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// Form login masih pakai field "Username" seperti sebelumnya; supaya tetap bisa
// memakai Supabase Auth (yang berbasis email), username dipetakan ke alamat
// email "<username>@simrs.local" saat membuat akun staf di Supabase Auth.
const EMAIL_DOMAIN = "simrs.local";

/* ================= STATE ================= */
let state = {
  page: "dashboard",
  activeKunjunganId: null,
  local: DEMO_MODE ? seedLocalDemo() : null,
  user: null, // {nama, role} — diisi setelah login
  pegawaiCache: null // daftar pegawai (utk dropdown Pelaksana/DPJP), diisi sekali & dibersihkan saat ada perubahan
};

const NAV = [
  {id:"dashboard", label:"Dashboard", step:null},
  {id:"pendaftaran", label:"1. Pendaftaran", step:"1"},
  {id:"kunjungan", label:"2. Kunjungan Aktif", step:"2"},
  {id:"igd", label:"🚑 IGD", step:null},
  {id:"asesmenawal", label:"🩺 Asesmen Awal", step:null},
  {id:"rekammedis", label:"3. Diagnosa & Tindakan", step:"3"},
  {id:"cppt", label:"📝 CPPT & Tanda Vital", step:null},
  {id:"billing", label:"4. Billing", step:"4"},
  {id:"inacbg", label:"5. Prediksi INA-CBG", step:"5"},
  {id:"pulang", label:"6. Proses Pulang", step:"6"},
  {id:"rekap", label:"Rekap Klaim", step:null},
  {id:"aturanba", label:"📋 Aturan BA 2024", step:null},
{id:"penunjang", label:"🧪 Unit Penunjang", step:null},
{id:"tarif", label:"💰 Master Tarif", step:null},
];

// Peta akses per role. "admin" selalu dapat semua menu.
const ROLE_ACCESS = {
  admin: NAV.map(n=>n.id),
  pendaftaran: ["dashboard","pendaftaran","kunjungan"],
  // PERBAIKAN Fase 3: kunci ini dulu tertulis "rekammedis" (tanpa garis-bawah),
  // padahal role sungguhan dari database (Supabase) adalah "rekam_medis". Akibatnya
  // staf rekam medis tidak pernah cocok dengan kunci manapun di sini, dan baris
  // navAllowed() di bawah diam-diam memberi mereka SEMUA menu admin (fallback
  // "|| ROLE_ACCESS.admin"). RLS di database tetap menolak aksi yang tidak sah,
  // jadi tidak ada data bocor — tapi menu yang tampil salah & membingungkan.
  rekam_medis: ["dashboard","kunjungan","asesmenawal","rekammedis","cppt","aturanba","igd"],
  perawat: ["dashboard","kunjungan","asesmenawal","rekammedis","cppt","aturanba","igd"],
  kasir: ["dashboard","kunjungan","billing","penunjang","tarif"],
verifikator: ["dashboard","kunjungan","inacbg","pulang","rekap","aturanba","penunjang","tarif"],
};
// Hak akses granular (menambah, bukan mengganti, ROLE_ACCESS di atas): admin
// bisa mencentang modul satu per satu per staf lewat halaman "Kelola Hak
// Akses". Satu modul bisa membuka lebih dari satu menu (mis. modul lab/rad/
// farmasi/gizi/cssd/linen semuanya membuka menu "penunjang" yang sama).
const MODUL_KE_NAV = {
  pendaftaran:["pendaftaran"], kunjungan:["kunjungan"], igd:["igd","cppt","asesmenawal"], rekammedis:["rekammedis","cppt","asesmenawal"],
  billing:["billing"], inacbg:["inacbg"], pulang:["pulang"], rekap:["rekap"], aturanba:["aturanba"],
  lab:["penunjang"], rad:["penunjang"], farmasi:["penunjang","cppt"], gizi:["penunjang","cppt"], cssd:["penunjang"], linen:["penunjang"],
  tarif:["tarif"]
};
// Daftar modul yang bisa dicentang admin di halaman "Kelola Hak Akses".
const DAFTAR_MODUL = [
  {id:"pendaftaran", label:"Pendaftaran"},
  {id:"kunjungan", label:"Kunjungan Aktif"},
  {id:"igd", label:"IGD"},
  {id:"rekammedis", label:"Diagnosa & Tindakan (Rekam Medis)"},
  {id:"billing", label:"Billing"},
  {id:"inacbg", label:"Prediksi INA-CBG"},
  {id:"pulang", label:"Proses Pulang"},
  {id:"rekap", label:"Rekap Klaim"},
  {id:"aturanba", label:"Aturan BA 2024"},
  {id:"lab", label:"Unit Penunjang — Lab"},
  {id:"rad", label:"Unit Penunjang — Radiologi"},
  {id:"farmasi", label:"Unit Penunjang — Farmasi"},
  {id:"gizi", label:"Unit Penunjang — Gizi"},
  {id:"cssd", label:"Unit Penunjang — CSSD"},
  {id:"linen", label:"Unit Penunjang — Linen"},
  {id:"tarif", label:"Master Tarif"},
  {id:"lihat_nik", label:"⚠️ Lihat NIK Lengkap Pasien (sensitif, wajib 2FA)"},
];
function navAllowed(){
  if(!state.user) return [];
  if(state.user.role === "admin") return NAV.map(n=>n.id);
  const role = (state.user.role||"").toLowerCase();
  // PERBAIKAN: dulu ada fallback "|| ROLE_ACCESS.admin" yang diam-diam memberi
  // SEMUA menu admin ke role manapun yang tidak cocok di ROLE_ACCESS (termasuk
  // role baru "staf" untuk hak akses granular). Sekarang kalau role tidak
  // dikenal, dianggap TIDAK ADA menu bawaan (aman secara default) — menu staf
  // "staf" murni datang dari modul yang dicentang admin di bawah ini.
  const daftarLegacy = ROLE_ACCESS[role] || [];
  const modul = state.user.modul || [];
  const daftarModul = modul.flatMap(m => MODUL_KE_NAV[m] || []);
  return Array.from(new Set(["dashboard", ...daftarLegacy, ...daftarModul]));
}

function renderNav(){
  const nav = document.getElementById("nav");
  const allowed = navAllowed();
  nav.innerHTML = NAV.filter(n=>allowed.includes(n.id)).map(n => `
    <button class="${state.page===n.id?'active':''}" onclick="goTo('${n.id}')">
      ${n.step ? `<span class="step">${n.step}</span>` : `<span class="step">•</span>`} ${n.label}
    </button>`).join("");
  const ub = document.getElementById("userBox");
  if(ub && state.user){
    ub.innerHTML = `<b>${state.user.nama}</b><span class="role-tag">${state.user.role}</span><br>
      ${DEMO_MODE ? "" : `<button onclick="mulaiSetup2FA()">🔒 Aktifkan 2FA</button>`}
      ${(!DEMO_MODE && state.user.role==="admin") ? `<button onclick="pageKelolaHakAkses()">🗂️ Kelola Hak Akses</button>` : ""}
      ${(!DEMO_MODE && state.user.role==="admin") ? `<button onclick="pageKelolaPegawai()">👥 Kelola Pegawai</button>` : ""}
      ${(!DEMO_MODE && state.user.role==="admin") ? `<button onclick="pageRekapPegawai()">📊 Rekap Pegawai</button>` : ""}
      <button onclick="logout()">Keluar</button>`;
  }
}
function goTo(page){
  if(!navAllowed().includes(page)){ toast("Menu ini tidak tersedia untuk role Anda"); return; }
  state.page = page; render();
}
function logout(){ if(!DEMO_MODE) supabase.auth.signOut(); state.user = null; state.pegawaiCache = null; render(); }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ================= LOGIN ================= */
async function renderLogin(){
  document.getElementById("app").innerHTML = `
    <div class="login-wrap"><div class="login-card">
      <h1>SIMRS Allam Medica</h1>
      <p>${DEMO_MODE ? "Mode demo — pakai admin / admin123" : "Masuk untuk melanjutkan"}</p>
      <label>Username</label><input id="loginUser" placeholder="admin" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
      <label>Password</label><input id="loginPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn" onclick="doLogin()">Masuk</button>
      <div class="login-err" id="loginErr"></div>
    </div></div>`;
}
async function doLogin(){
  const username = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPass").value.trim();
  const r = await api("login", {username, password}, "POST");
  if(r.ok){
    state.user = {nama:r.nama, role:r.role, modul:r.modul||[]};
    rebuildAppShell();
    render();
  } else if(r.mfaRequired){
    // Fase 3: akun ini sudah mengaktifkan 2FA — minta kode Authenticator
    // sebelum benar-benar masuk (sesi password saja belum cukup / "aal1").
    renderMfaLoginPrompt();
  } else {
    document.getElementById("loginErr").textContent = r.msg || "Login gagal";
  }
}

/* ============ FASE 3: VERIFIKASI 2FA SAAT LOGIN ============ */
function renderMfaLoginPrompt(){
  document.getElementById("app").innerHTML = `
    <div class="login-wrap"><div class="login-card">
      <h1>Verifikasi 2 Langkah</h1>
      <p>Buka aplikasi Authenticator di HP Anda, lalu masukkan 6 digit kode yang tampil di sana.</p>
      <label>Kode 2FA</label>
      <input id="mfaCode" maxlength="6" inputmode="numeric" placeholder="123456" onkeydown="if(event.key==='Enter')submitMfaLogin()">
      <button class="btn" onclick="submitMfaLogin()">Verifikasi</button>
      <div class="login-err" id="loginErr"></div>
    </div></div>`;
  document.getElementById("mfaCode").focus();
}
async function submitMfaLogin(){
  const code = (document.getElementById("mfaCode").value||"").trim();
  if(!code){ document.getElementById("loginErr").textContent = "Masukkan kode 2FA"; return; }
  const r = await verifyMfaLogin(code);
  if(r.ok){
    state.user = {nama:r.nama, role:r.role, modul:r.modul||[]};
    rebuildAppShell();
    render();
  } else {
    document.getElementById("loginErr").textContent = r.msg || "Kode salah, coba lagi";
  }
}
async function verifyMfaLogin(code){
  try{
    const { data: factorData, error: factorErr } = await supabase.auth.mfa.listFactors();
    if(factorErr) return {ok:false, msg:"Gagal membaca faktor 2FA: "+factorErr.message};
    const totpFactor = (factorData.totp||[])[0];
    if(!totpFactor) return {ok:false, msg:"Tidak ada faktor 2FA terdaftar"};
    const { data: challenge, error: chErr } = await supabase.auth.mfa.challenge({ factorId: totpFactor.id });
    if(chErr) return {ok:false, msg:"Gagal memulai verifikasi: "+chErr.message};
    const { error: vErr } = await supabase.auth.mfa.verify({ factorId: totpFactor.id, challengeId: challenge.id, code });
    if(vErr) return {ok:false, msg:"Kode 2FA salah atau sudah kedaluwarsa"};
    const { data: userData, error: userErr } = await supabase.auth.getUser();
    if(userErr || !userData.user) return {ok:false, msg:"Sesi tidak valid, ulangi login dari awal"};
    const { data: profile, error: profileErr } = await supabase
      .from("profiles").select("nama, role, aktif").eq("id", userData.user.id).single();
    if(profileErr || !profile || !profile.aktif) return {ok:false, msg:"Akun tidak ditemukan / tidak aktif"};
    const modul = await fetchModulSaya();
    return {ok:true, nama:profile.nama, role:profile.role, modul};
  }catch(err){
    return {ok:false, msg:"Gagal verifikasi 2FA: "+err.message};
  }
}

/* ============ FASE 3: AKTIFKAN 2FA (dari menu setelah login) ============ */
async function mulaiSetup2FA(){
  try{
    const { data, error } = await supabase.auth.mfa.enroll({ factorType: "totp" });
    if(error){ toast("Gagal memulai setup 2FA: "+error.message); return; }
    window.__mfaEnroll = data; // {id, totp:{qr_code, secret, uri}}
    render2FASetup();
  }catch(err){ toast("Gagal memulai setup 2FA: "+err.message); }
}
function render2FASetup(){
  const m = document.getElementById("main");
  const d = window.__mfaEnroll;
  m.innerHTML = `<h1>Aktifkan Verifikasi 2 Langkah (2FA)</h1>
    <p class="sub">Melindungi akun Anda — terutama penting untuk melihat NIK pasien secara penuh.</p>
    <div class="card" style="max-width:420px">
      <p><b>1.</b> Pasang aplikasi Authenticator di HP (Google Authenticator, Microsoft Authenticator, atau Authy — gratis di Play Store/App Store) kalau belum punya.</p>
      <p><b>2.</b> Buka aplikasi itu, pilih tambah akun lewat scan QR, lalu arahkan kamera ke gambar ini:</p>
      <div style="text-align:center;margin:12px 0"><img src="${d.totp.qr_code}" style="width:200px;height:200px;border:1px solid var(--line);border-radius:8px"></div>
      <p class="hint">Tidak bisa scan? Masukkan kode ini secara manual di aplikasi Authenticator: <code>${d.totp.secret}</code></p>
      <p><b>3.</b> Masukkan 6 digit kode yang muncul di aplikasi Authenticator Anda:</p>
      <input id="kode2fa" maxlength="6" inputmode="numeric" placeholder="123456">
      <button class="btn" style="margin-top:10px" onclick="verifikasiSetup2FA()">Aktifkan 2FA</button>
      <button class="btn ghost" style="margin-top:10px" onclick="goTo('dashboard')">Batal</button>
    </div>`;
}
async function verifikasiSetup2FA(){
  const code = (document.getElementById("kode2fa").value||"").trim();
  const factorId = window.__mfaEnroll && window.__mfaEnroll.id;
  if(!factorId){ toast("Sesi setup 2FA hilang, ulangi dari menu"); return; }
  if(!code){ toast("Masukkan 6 digit kode dari aplikasi Authenticator"); return; }
  try{
    const { data: challenge, error: chErr } = await supabase.auth.mfa.challenge({ factorId });
    if(chErr){ toast("Gagal: "+chErr.message); return; }
    const { error: vErr } = await supabase.auth.mfa.verify({ factorId, challengeId: challenge.id, code });
    if(vErr){ toast("Kode salah, coba lagi"); return; }
    toast("2FA berhasil diaktifkan! Login berikutnya akan meminta kode ini.");
    window.__mfaEnroll = null;
    goTo("dashboard");
  }catch(err){ toast("Gagal mengaktifkan 2FA: "+err.message); }
}

// Hak akses granular: ambil daftar modul yang dicentang admin untuk akun
// yang sedang login (kosong kalau akun ini masih pakai role tetap lama saja).
async function fetchModulSaya(){
  try{
    const { data, error } = await supabase.rpc("api_dispatch", { p_action: "getModulSaya", p_payload: {} });
    if(error || !data || !data.ok) return [];
    return data.modul || [];
  }catch(err){ return []; }
}

async function api(action, data, method){
  if (DEMO_MODE) return localApi(action, data);

  // Login ditangani khusus lewat Supabase Auth (bukan tabel biasa), supaya
  // password benar-benar di-hash & dikelola sistem, bukan dibandingkan
  // sebagai teks polos seperti mode demo lama.
  if (action === "login"){
    const username = (data && data.username || "").trim();
    const password = (data && data.password || "").trim();
    if(!username || !password) return {ok:false, msg:"Username & password wajib diisi"};
    const email = `${username}@${EMAIL_DOMAIN}`;
    const { data: authData, error: authError } = await supabase.auth.signInWithPassword({ email, password });
    if (authError || !authData.user) return {ok:false, msg:"Username / password salah"};

    // Fase 3: kalau akun ini sudah punya 2FA aktif, sesi password saja ("aal1")
    // belum cukup untuk masuk — minta verifikasi kode Authenticator dulu
    // ("aal2") sebelum mengizinkan akses. Kalau akun belum aktifkan 2FA,
    // currentLevel sudah sama dengan nextLevel dan langsung lanjut seperti biasa.
    const { data: aalData } = await supabase.auth.mfa.getAuthenticatorAssuranceLevel();
    if (aalData && aalData.nextLevel === "aal2" && aalData.currentLevel !== aalData.nextLevel){
      return {ok:false, mfaRequired:true, msg:"Perlu verifikasi 2FA"};
    }

    const { data: profile, error: profileError } = await supabase
      .from("profiles").select("nama, role, aktif").eq("id", authData.user.id).single();
    if (profileError || !profile || !profile.aktif){
      await supabase.auth.signOut();
      return {ok:false, msg:"Akun tidak ditemukan / tidak aktif. Hubungi admin."};
    }
    const modul = await fetchModulSaya();
    return {ok:true, nama: profile.nama, role: profile.role, modul};
  }

  try{
    const { data: result, error } = await supabase.rpc("api_dispatch", { p_action: action, p_payload: data || {} });
    if (error){ toast("Gagal hubungi server: " + error.message); return {ok:false, msg: error.message}; }
    return result;
  }catch(err){
    toast("Gagal hubungi server: " + err.message);
    return {ok:false, msg: err.message};
  }
}

function genId(p){ return p+"-"+Date.now().toString().slice(-8)+Math.floor(Math.random()*90+10); }

function localApi(action, d){
  const L = state.local;
  switch(action){
    case "login": {
      const users = [
        {u:"admin", p:"admin123", nama:"Administrator", role:"admin"},
        {u:"pendaftaran", p:"1234", nama:"Petugas Pendaftaran", role:"pendaftaran"},
        {u:"perawat", p:"1234", nama:"Perawat/Rekam Medis", role:"rekammedis"},
        {u:"kasir", p:"1234", nama:"Kasir", role:"kasir"},
        {u:"verifikator", p:"1234", nama:"Verifikator Klaim", role:"verifikator"},
      ];
      const found = users.find(x=>x.u===d.username && x.p===d.password);
      if(!found) return {ok:false, msg:"Username / password salah (mode demo: admin/admin123, atau pendaftaran, perawat, kasir, verifikator — semua password 1234)"};
      return {ok:true, nama:found.nama, role:found.role};
    }
    case "daftarPasienBaru": {
      const rm = "RM"+String(L.pasien.length+1).padStart(5,"0");
      const pasien = {RM:rm, ...d, TglDaftar:new Date().toISOString()};
      L.pasien.push(pasien);
      return {ok:true, rm, data:pasien};
    }
    case "buatKunjungan": {
      const id = genId("KJ");
      const k = {KunjunganID:id, TglKunjungan:new Date().toISOString(), Status:"Aktif", ...d};
      L.kunjungan.push(k);
      return {ok:true, kunjunganId:id, data:k};
    }
    case "getKunjunganAktif": return L.kunjungan.filter(k=>k.Status==="Aktif");
    case "getKunjunganDetail": {
      const k = L.kunjungan.find(x=>x.KunjunganID===d.id);
      if(!k) return {ok:false, msg:"Tidak ditemukan"};
      const pasien = L.pasien.find(p=>p.RM===k.rm || p.RM===k.RM);
      return {ok:true, kunjungan:k, pasien,
        rawatInap: L.rawatInap.find(r=>r.KunjunganID===d.id),
        diagnosa: L.diagnosa.filter(x=>x.KunjunganID===d.id),
        tindakan: L.tindakan.filter(x=>x.KunjunganID===d.id),
        billing: L.billing.filter(x=>x.KunjunganID===d.id),
        klaim: L.klaim.find(x=>x.KunjunganID===d.id)};
    }
    case "admisiRawatInap": {
      const ri = {RawatInapID:genId("RI"), TglMasuk:new Date().toISOString(), Status:"Dirawat", ...d};
      L.rawatInap.push(ri);
      const k = L.kunjungan.find(x=>x.KunjunganID===d.kunjunganId); if(k) k.JenisKunjungan="Rawat Inap";
      return {ok:true, data:ri};
    }
    case "tambahDiagnosa": {
      const item = {DiagnosaID:genId("DX"), ...d}; L.diagnosa.push(item); return {ok:true, data:item};
    }
    case "tambahTindakan": {
      const item = {TindakanID:genId("TX"), ...d}; L.tindakan.push(item); return {ok:true, data:item};
    }
    case "tambahBilling": {
      const total = Number(d.qty)*Number(d.tarifSatuan);
      const item = {BillingID:genId("BL"), ...d, Total:total}; L.billing.push(item); return {ok:true, data:item};
    }
    case "prediksiINACBG": {
      const detail = localApi("getKunjunganDetail", {id:d.kunjunganId});
      const diagnosaUtama = detail.diagnosa.find(x=>x.jenis==="Utama"||x.JenisDiagnosa==="Utama");
      const diagnosaSekunder = detail.diagnosa.filter(x=>(x.jenis||x.JenisDiagnosa)==="Sekunder");
      const jenisRIRJ = detail.kunjungan.jenisKunjungan==="Rawat Inap"||detail.kunjungan.JenisKunjungan==="Rawat Inap" ? "RI":"RJ";
      const kelasRawat = detail.rawatInap ? detail.rawatInap.kelas||detail.rawatInap.Kelas : "3";
      let severity = "I";
      if(diagnosaSekunder.length>=3) severity="III"; else if(diagnosaSekunder.length>=1) severity="II";
      let match=null, sumberMatch="";
      if(diagnosaUtama){
        const kode = String(diagnosaUtama.kodeICD10||diagnosaUtama.KodeICD10||"").trim().toUpperCase();
        const found = L.diagCbgMap.filter(m=>m.ICD10Utama.toUpperCase()===kode && m.JenisRIRJ===jenisRIRJ);
        if(found.length){
          const tarifRef = L.tarif.find(t=>t.KodeCBG===found[0].KodeCBG);
          match = {KodeCBG:found[0].KodeCBG, Deskripsi: tarifRef?tarifRef.Deskripsi:"(dari histori klaim riil, deskripsi belum ada di tabel tarif)",
            TarifKelas1:tarifRef?tarifRef.TarifKelas1:0, TarifKelas2:tarifRef?tarifRef.TarifKelas2:0, TarifKelas3:tarifRef?tarifRef.TarifKelas3:0, TarifRJ:tarifRef?tarifRef.TarifRJ:0,
            _rata: Math.round(found.reduce((s,m)=>s+Number(m.BiayaPengajuanContoh||0),0)/found.length), _n: found.length};
          sumberMatch="riwayat_klaim_riil";
        }
      }
      if(!match && diagnosaUtama){
        const kw=(diagnosaUtama.deskripsi||diagnosaUtama.Deskripsi||"").toLowerCase().split(" ")[0];
        match = L.tarif.find(t=>t.JenisRIRJ===jenisRIRJ && t.Deskripsi.toLowerCase().includes(kw));
      }
      if(!match) match = L.tarif.find(t=>t.JenisRIRJ===jenisRIRJ);
      let tarifPrediksi=0, kodeCBG="-", deskripsiCBG="Tidak ditemukan kecocokan";
      if(match){ kodeCBG=match.KodeCBG; deskripsiCBG=match.Deskripsi;
        tarifPrediksi = jenisRIRJ==="RJ" ? Number(match.TarifRJ||0) : Number(match["TarifKelas"+kelasRawat]||0);
        if(!tarifPrediksi && match._rata) tarifPrediksi = match._rata;
      }
      const totalBillingRS = detail.billing.reduce((s,r)=>s+Number(r.Total||0),0);
      const selisih = totalBillingRS - tarifPrediksi;
      let catatan=[];
      if(!match) catatan.push("Kode CBG tidak ditemukan otomatis — lengkapi tabel tarif referensi.");
      if(sumberMatch==="riwayat_klaim_riil") catatan.push("Prediksi berdasarkan "+match._n+" histori klaim riil (rata-rata pengajuan Rp"+Number(match._rata).toLocaleString('id-ID')+") — sumbernya kasus yang sempat pending/dispute, tetap cek ulang.");
      if(tarifPrediksi>0 && totalBillingRS>tarifPrediksi*1.15) catatan.push("PERINGATAN: billing RS melebihi prediksi tarif >15%.");
      if(diagnosaSekunder.length===0) catatan.push("Belum ada diagnosa sekunder — cek kemungkinan CC/MCC yang belum tercatat.");
      const teks = ((diagnosaUtama?(diagnosaUtama.deskripsi||diagnosaUtama.Deskripsi):"")+" "+
        detail.diagnosa.map(x=>x.deskripsi||x.Deskripsi).join(" ")+" "+
        detail.tindakan.map(x=>x.deskripsi||x.Deskripsi).join(" ")+" "+
        (detail.kunjungan.keluhanUtama||detail.kunjungan.KeluhanUtama||"")).toLowerCase();
      L.aturanBA2024.filter(a=>a.KataKunci.split(",").some(kw=>teks.includes(kw.trim()))).forEach(a=>{
        catatan.push("BA 3760/2024 ("+a.Ranah+" #"+a.No+" - "+a.Kasus+"): "+a.Ketentuan);
      });
      const klaim = {KlaimID:genId("KL"), KunjunganID:d.kunjunganId, KodeCBGPrediksi:kodeCBG, DeskripsiCBG:deskripsiCBG,
        Severity:severity, KelasRawat:kelasRawat, TarifPrediksi:tarifPrediksi, TotalBillingRS:totalBillingRS,
        Selisih:selisih, StatusKlaim:"Draft Prediksi", Catatan:catatan.join(" | "), TglPrediksi:new Date().toISOString()};
      L.klaim = L.klaim.filter(x=>x.KunjunganID!==d.kunjunganId);
      L.klaim.push(klaim);
      return {ok:true, data:klaim};
    }
    case "prosesPulang": {
      const ri = L.rawatInap.find(r=>r.KunjunganID===d.kunjunganId);
      if(ri){ const masuk=new Date(ri.TglMasuk); const los=Math.max(1, Math.round((Date.now()-masuk)/86400000));
        ri.TglKeluar=new Date().toISOString(); ri.CaraKeluar=d.caraKeluar||"Pulang Normal"; ri.LOS=los; ri.Status="Pulang"; }
      const k = L.kunjungan.find(x=>x.KunjunganID===d.kunjunganId); if(k) k.Status="Selesai";
      const prediksi = localApi("prediksiINACBG", {kunjunganId:d.kunjunganId});
      return {ok:true, msg:"Pasien diproses pulang", prediksiINACBG:prediksi.data};
    }
    case "getRekapKlaim": return L.klaim;
    case "getTarifList": return L.tarif;
    case "getAturanBA2024": return L.aturanBA2024;
    case "getDiagnosaCBGMap": return L.diagCbgMap;
    case "getDashboard": {
      const hariIni = L.kunjungan.filter(k=>new Date(k.TglKunjungan).toDateString()===new Date().toDateString());
      return {ok:true, kunjunganHariIni:hariIni.length, kunjunganAktif:L.kunjungan.filter(k=>k.Status==="Aktif").length,
        pasienDirawat:L.rawatInap.filter(r=>r.Status==="Dirawat").length, totalPasienTerdaftar:L.pasien.length,
        klaimBerpotensiRugi:L.klaim.filter(k=>k.Selisih<0).length, totalKlaimDiprediksi:L.klaim.length};
    }
  }
  return {ok:false, msg:"action tidak dikenal (demo): "+action};
}

    pulang: pagePulang, rekap: pageRekap, aturanba: pageAturanBA, penunjang: pagePenunjang, tarif: pageTarif
  };
  m.innerHTML = `${DEMO_MODE ? `<div class="config-note">⚠️ Mode demo aktif — data hanya tersimpan di browser ini (belum tersambung ke Google Sheets). Isi <code>API_URL</code> di bagian atas file dengan Web App URL hasil deploy Code.gs untuk data permanen multi-user.</div>` : ""}`;

}

  r.pasien.forEach(p=>{
    html += `<div class="igd-card triase-${p.triase}" onclick="bukaDetailIGD('${p.igdId}')">

async function submitPasienBaru(lewatiCekDuplikat){
  const data = {
    nama: val("nama"), nik: val("nik"), tglLahir: val("tglLahir"), jk: val("jk"),
    alamat: val("alamat"), noHP: val("noHP"), namaIbuKandung: val("namaIbu"),

    golonganDarah: val("golDarah"), alergi: val("alergi"),

    lewatiCekDuplikat: !!lewatiCekDuplikat
  };
  if(!data.nama){ toast("Nama wajib diisi"); return; }

  const r = await api("daftarPasienBaruV2", data, "POST");

  if(!r.ok && r.duplikat){
    let html = `<div style="border:1px solid #c0392b;background:#fdecea;border-radius:8px;padding:10px;margin-top:8px">
      ⚠️ Kemungkinan pasien ini sudah terdaftar. Periksa dulu:</div>`;
    r.kandidat.forEach(k=>{
      html += `<div style="border:1px solid #e0a800;background:#fff8e6;border-radius:8px;padding:8px 12px;margin-top:6px;cursor:pointer" onclick="pakaiRMLama('${k.rm}')">
        <b>${k.rm}</b> — ${k.nama}<br><span style="font-size:12px;color:#666">${k.alasan} · NIK: ${k.nik||'-'} · HP: ${k.noHP||'-'}</span>

    });

    document.getElementById("hasilDaftar").innerHTML = html;
    return;
  }

  if(r.ok){
    lastRM = r.rm;
    document.getElementById("hasilDaftar").innerHTML = `✅ Terdaftar dengan No. RM: <b>${r.rm}</b>`;
    document.getElementById("cariRM").value = r.rm;

  }
}

let searchDebounce;
function cariKode(inputId, boxId, searchFn){
  clearTimeout(searchDebounce);
  const q = val(inputId);
  const box = document.getElementById(boxId);
  if(q.length < 2){ box.classList.remove("show"); box.innerHTML=""; return; }
  searchDebounce = setTimeout(async ()=>{
    const results = await searchFn(q);
    if(!results.length){ box.innerHTML = `<div class="suggest-item" style="color:var(--muted)">Tidak ada hasil</div>`; box.classList.add("show"); return; }
    box.innerHTML = results.map(r=>`<div class="suggest-item" onclick='pilihKode(${JSON.stringify(inputId)}, ${JSON.stringify(boxId)}, ${JSON.stringify(r.Kode||r.kode)}, ${JSON.stringify((r.Deskripsi||r.deskripsi||"").replace(/'/g,"&#39;"))})'><b>${r.Kode||r.kode}</b> — ${r.Deskripsi||r.deskripsi}</div>`).join("");
    box.classList.add("show");
  }, 250);
}
function pilihKode(inputId, boxId, kode, desk){
  document.getElementById(boxId).classList.remove("show");
  document.getElementById(inputId).value = kode + " — " + desk;
  if(inputId==="cariICD10"){ document.getElementById("kodeICD10").value = kode; document.getElementById("deskDiag").value = desk; }
  if(inputId==="cariICD9"){ document.getElementById("kodeICD9").value = kode; document.getElementById("deskTindakan").value = desk; }
}
// Fallback offline ringkas untuk mode demo (database lengkap 7.433/3.979 kode ada di backend Apps Script)
const ICD10_DEMO_FALLBACK = [
  {Kode:"A09", Deskripsi:"Diarrhoea and gastro-enteritis of presumed infectious origin"},
  {Kode:"A49.9", Deskripsi:"Bacterial infection, unspecified"},
  {Kode:"I50.0", Deskripsi:"Congestive heart failure"},
  {Kode:"I11.9", Deskripsi:"Hypertensive heart disease without (congestive) heart failure"},
  {Kode:"J18.9", Deskripsi:"Pneumonia, unspecified"},
  {Kode:"Z09.8", Deskripsi:"Follow-up examination after other treatment for other conditions"},
];
const ICD9_DEMO_FALLBACK = [
  {Kode:"99.29", Deskripsi:"Injection or infusion of other therapeutic or prophylactic substance"},
  {Kode:"93.57", Deskripsi:"Application of other wound dressing"},
  {Kode:"88.72", Deskripsi:"Diagnostic ultrasound of heart"},
  {Kode:"45.13", Deskripsi:"Other endoscopy of small intestine"},
];
async function searchICD10API(q){
  if(DEMO_MODE){ q=q.toLowerCase(); return ICD10_DEMO_FALLBACK.filter(r=>r.Kode.toLowerCase().includes(q)||r.Deskripsi.toLowerCase().includes(q)); }
  return await api("searchICD10", {q}, "GET");
}
async function searchICD9API(q){
  if(DEMO_MODE){ q=q.toLowerCase(); return ICD9_DEMO_FALLBACK.filter(r=>r.Kode.toLowerCase().includes(q)||r.Deskripsi.toLowerCase().includes(q)); }
  return await api("searchICD9", {q}, "GET");
}

async function patientStrip(kunjunganId){
  if(!kunjunganId) return `<div class="card empty">Belum ada kunjungan dipilih. Ke menu <b>Kunjungan Aktif</b> dulu untuk memilih pasien.</div>`;
  const d = await api("getKunjunganDetail", {id:kunjunganId}, "GET");

  window.__detail = d;
  const p = d.pasien||{};
  // Fase 3: NIK penuh tidak pernah dikirim server dalam respons biasa —
  // hanya 4 digit terakhir (p.nik4). Untuk role yang berwenang, sediakan
  // tombol yang memanggil fn_decrypt_nik lewat aksi khusus "lihatNikLengkap"
  // (wajib role sah + sesi 2FA, dan setiap klik tercatat di server).
  const bolehLihatNik = !DEMO_MODE && state.user && (["admin","rekam_medis","verifikator"].includes(state.user.role) || (state.user.modul||[]).includes("lihat_nik"));
  const nikBaris = p.id ? `NIK: ****${p.nik4||p.NIK4||"----"}${bolehLihatNik ? ` <button class="btn sm ghost" onclick="lihatNikLengkap('${p.id}')">Lihat NIK Lengkap</button>` : ""}` : "";
  return `<div class="patient-strip">
    <div><b>${p.nama||p.Nama||"-"}</b> · RM ${p.RM||"-"}</div>
    <div>${d.kunjungan.jenisKunjungan||d.kunjungan.JenisKunjungan}</div>
    <div>DPJP: ${d.kunjungan.dpjp||d.kunjungan.DPJP||"-"}</div>
    <div>Kunjungan: ${kunjunganId}</div>
    ${nikBaris ? `<div>${nikBaris}</div>` : ""}

// Analisa kalimat diagnosa dokter (bahasa medis bebas): pecah jadi kata kunci,
// lalu cari tiap kata kunci itu ke database resmi ICD-10 (diagnosa) & ICD-9-CM
// (tindakan) yang sudah ada (fungsi pencarian yang sama dipakai kotak "Cari
// Kode" di bawah) — kode yang cocok dengan LEBIH BANYAK kata kunci ditaruh di
// atas. Ini murni pencocokan kata dari database resmi, BUKAN kecerdasan
// buatan/AI — tetap wajib dicek ulang oleh dokter/petugas rekam medis sebelum
// disimpan, terutama untuk kalimat yang punya banyak istilah umum.
const STOPWORD_DIAGNOSA = new Set(["dan","dengan","dgn","di","ke","dari","pada","yang","atau","tanpa","tidak","ada","akibat","karena","et","causa","suspek","susp","serta","untuk","akan","juga","sudah","belum","masih","oleh","sejak","disertai","tampak","terdapat","adalah","merupakan","suatu","beberapa","seperti","berupa","ringan","sedang","berat","kronis","akut"]);
// Deskripsi resmi ICD-10/ICD-9-CM di database ini berbahasa Inggris/Latin
// (standar WHO), sedangkan dokter biasanya menulis dalam Bahasa Indonesia.
// Kamus kecil ini menerjemahkan istilah Indonesia yang umum dipakai jadi
// padanan Inggris/Latin-nya, supaya ikut dicari juga — bukan kamus lengkap,
// hanya istilah yang sering muncul di layanan rumah sakit tipe C sehari-hari.
// Kalau suatu istilah tidak ada di sini, tetap bisa dicari manual di kotak
// "Cari Kode / Deskripsi" dengan kata Inggris/Latin-nya.
const KAMUS_ISTILAH_MEDIS = {
  "diare":["diarrhoea","diarrhea"], "mencret":["diarrhoea","diarrhea"],
  "muntah":["vomit"], "demam":["fever","febrile"],
  "batuk":["cough"], "pilek":["coryza","rhinitis"],
  "sesak napas":["dyspnoea","dyspnea"], "sesak":["dyspnoea","dyspnea"],
  "nyeri":["pain"], "patah tulang":["fracture"], "patah":["fracture"],
  "luka bakar":["burn"], "luka":["wound","injury"],
  "infeksi saluran kemih":["urinary tract infection"], "infeksi":["infection"],
  "radang paru":["pneumonia"], "paru paru basah":["pneumonia"],
  "radang usus":["enteritis"], "radang tenggorokan":["pharyngitis"],
  "radang telinga":["otitis"], "radang":["inflammation"],
  "darah tinggi":["hypertension","hypertensive"], "hipertensi":["hypertension","hypertensive"],
  "gagal jantung":["heart failure","cardiac failure"], "jantung":["heart","cardiac"],
  "stroke":["stroke","cerebrovascular"], "kejang":["seizure","convulsion"],
  "dehidrasi":["dehydration"], "kurang darah":["anaemia","anemia"], "anemia":["anaemia","anemia"],
  "asma":["asthma"], "tbc":["tuberculosis"], "tb paru":["tuberculosis"], "tipes":["typhoid"], "tifoid":["typhoid"],
  "usus buntu":["appendicitis"], "apendisitis":["appendicitis"],
  "batu ginjal":["renal calculus","kidney stone","urolithiasis"],
  "gagal ginjal":["renal failure","kidney failure"],
  "hamil":["pregnancy","pregnant"], "persalinan":["delivery","labour","labor"],
  "keguguran":["abortion","miscarriage"], "katarak":["cataract"],
  "tumor":["tumour","tumor","neoplasm"], "kanker":["cancer","malignant","malignancy"],
  "alergi":["allergy","allergic"], "keracunan":["poisoning"],
  "cedera":["injury","trauma"], "kecelakaan":["accident"],
  "pendarahan":["haemorrhage","hemorrhage","bleeding"], "perdarahan":["haemorrhage","hemorrhage","bleeding"],
  "demam berdarah":["dengue"], "dbd":["dengue"], "campak":["measles"],
  "cacar":["varicella","chickenpox","smallpox"], "gondongan":["mumps"],
  "kencing manis":["diabetes mellitus","diabetes"], "diabetes":["diabetes"],
  "vertigo":["vertigo"], "migrain":["migraine"], "epilepsi":["epilepsy"],
  "lumpuh":["paralysis","palsy"], "buta":["blind","blindness"], "tuli":["deaf","deafness"],
  "sakit gigi":["dental","tooth"], "sembelit":["constipation"], "susah bab":["constipation"],
  "wasir":["haemorrhoid","hemorrhoid"], "ambeien":["haemorrhoid","hemorrhoid"],
  "hernia":["hernia"], "gagal napas":["respiratory failure"],
  "syok":["shock"], "koma":["coma"], "sepsis":["sepsis"],
  "keseleo":["sprain"], "dislokasi":["dislocation"],
  "rematik":["rheumatism","rheumatoid"], "asam urat":["gout"],
  "kolesterol":["cholesterol"], "kegemukan":["obesity"], "obesitas":["obesity"],
  "gizi buruk":["malnutrition"], "kuning":["jaundice"], "sakit kuning":["jaundice"],
  "hepatitis":["hepatitis"], "sirosis":["cirrhosis"], "gastritis":["gastritis"], "maag":["gastritis","dyspepsia"],
  "ispa":["respiratory infection","upper respiratory"], "isk":["urinary tract infection"]
};
function ambilKataKunciDiagnosa(teks){
  const teksLower = teks.toLowerCase();
  const kataDasar = teksLower.replace(/[^a-z0-9\s-]/g," ").split(/\s+/)
    .filter(w => w.length >= 4 && !STOPWORD_DIAGNOSA.has(w));
  const kataKamus = [];
  Object.keys(KAMUS_ISTILAH_MEDIS).forEach(frasa=>{
    if(teksLower.includes(frasa)) kataKamus.push(...KAMUS_ISTILAH_MEDIS[frasa]);
  });
  // maksimal 10 kata kunci (gabungan kata asli + padanan dari kamus) supaya
  // tidak terlalu banyak permintaan ke server
  return Array.from(new Set([...kataDasar, ...kataKamus])).slice(0, 10);
}
async function kumpulkanSaranKode(kataKunci, searchFn){
  const skor = {};
  for(const kw of kataKunci){
    const hasil = await searchFn(kw);
    (hasil||[]).forEach(r=>{
      const kode = r.Kode||r.kode, desk = r.Deskripsi||r.deskripsi;
      if(!skor[kode]) skor[kode] = {kode, desk, cocok:0};
      skor[kode].cocok++;
    });
  }
  return Object.values(skor).sort((a,b)=> b.cocok - a.cocok || a.kode.localeCompare(b.kode)).slice(0,10);
}
async function analisaKodeDariDiagnosa(){
  const teks = val("diagnosaMedisDokter");
  const box10 = document.getElementById("saranICD10DariDiagnosa");
  const box9 = document.getElementById("saranICD9DariDiagnosa");
  if(!teks || teks.length < 3){ toast("Ketik dulu kalimat diagnosa dokter (minimal 3 huruf) untuk dianalisa"); return; }
  const kataKunci = ambilKataKunciDiagnosa(teks);
  if(!kataKunci.length){ toast("Kalimat terlalu umum — coba tulis istilah medis yang lebih spesifik"); box10.innerHTML=""; box9.innerHTML=""; return; }
  toast("Menganalisa "+kataKunci.length+" kata kunci dari kalimat diagnosa...");
  const [saran10, saran9] = await Promise.all([ kumpulkanSaranKode(kataKunci, searchICD10API), kumpulkanSaranKode(kataKunci, searchICD9API) ]);
  const baris = (jenis) => (r) => `<div class="suggest-item" onclick='isiDariSaran(${JSON.stringify(jenis)}, ${JSON.stringify(r.kode)}, ${JSON.stringify((r.desk||"").replace(/'/g,"&#39;"))})'><b>${r.kode}</b> — ${r.desk} <span class="hint">(cocok ${r.cocok} kata kunci)</span></div>`;
  box10.innerHTML = saran10.length ? saran10.map(baris("icd10")).join("") : `<div class="suggest-item" style="color:var(--muted)">Tidak ada saran kode ICD-10 yang cocok dengan kalimat ini</div>`;
  box9.innerHTML = saran9.length ? saran9.map(baris("icd9")).join("") : `<div class="suggest-item" style="color:var(--muted)">Tidak ada saran kode ICD-9-CM yang cocok dengan kalimat ini</div>`;
  toast("Saran kode ditemukan — klik salah satu untuk mengisi otomatis (tetap cek ulang kecocokannya)");
}

// Hak akses granular: staf dengan role tetap lama (admin/kasir/verifikator)
// tetap melihat semua sub-unit seperti sebelumnya (tidak berubah). Staf baru
// (role "staf") hanya melihat sub-unit yang modulnya dicentangkan admin —
// misalnya apoteker cuma lihat tab Farmasi, bukan keenamnya.
const PENUNJANG_TAB_LABEL = {lab:"Lab", rad:"Radiologi", farmasi:"Farmasi", gizi:"Gizi", cssd:"CSSD", linen:"Linen"};
function penunjangTabsAllowed(){
  const semua = Object.keys(PENUNJANG_TAB_LABEL);
  if(!state.user) return [];
  if(["admin","kasir","verifikator"].includes(state.user.role)) return semua;
  return semua.filter(m => (state.user.modul||[]).includes(m));
}
async function pagePenunjang(el){
  const tabs = penunjangTabsAllowed();
  el.innerHTML = `<h1>Unit Penunjang</h1><p class="sub">Lab, Radiologi, Farmasi, Gizi, CSSD, Linen</p>

        ${tabs.map(t=>`<button class="btn" onclick="renderPenunjangTab('${t}')">${PENUNJANG_TAB_LABEL[t]}</button>`).join("")}
      </div>
      <div id="penunjangBody">${tabs.length ? "" : `<div class="empty">Belum ada sub-unit penunjang yang diizinkan untuk akun Anda. Hubungi admin.</div>`}</div>
    </div>`;
  if(tabs.length) renderPenunjangTab(tabs[0]);
}

async function pjSubmit(action, data){
  const r = await api(action, data, 'POST');
  if (r && (r.id || r.ok)) { toast('Tersimpan'); }
  else { toast((r && r.error) || 'Gagal menyimpan'); }
  const tabMap = { 'lab.buatOrder':'lab','rad.buatOrder':'rad','farmasi.buatResep':'farmasi','gizi.buatOrder':'gizi','cssd.terimaAlat':'cssd','linen.setorKotor':'linen' };
  renderPenunjangTab(tabMap[action] || 'lab');
}

function pjTable(rows, cols){
  if (!rows || !rows.length) return '<p class="sub">Belum ada data.</p>';
  return '<table style="width:100%;border-collapse:collapse;font-size:13px">' +
    '<tr>' + cols.map(c => `<th style="text-align:left;padding:6px;border-bottom:1px solid var(--line)">${c}</th>`).join('') + '</tr>' +
    rows.map(r => '<tr>' + cols.map(c => `<td style="padding:6px;border-bottom:1px solid var(--line)">${r[c] ?? ''}</td>`).join('') + '</tr>').join('') +
    '</table>';
}

/* ================== MASTER TARIF ================== */
async function pageTarif(el){
  el.innerHTML = `<h1>Master Tarif</h1><p class="sub">Rawat Inap, Rawat Jalan, Layanan Lain</p>
    <div class="card">
      <div style="display:flex;gap:6px;margin-bottom:14px;">
        <button class="btn" onclick="renderTarifTab('inap')">Rawat Inap</button>
        <button class="btn" onclick="renderTarifTab('jalan')">Rawat Jalan</button>
        <button class="btn" onclick="renderTarifTab('layanan')">Layanan Lain</button>
      </div>
      <div id="tarifBody"></div>
    </div>`;
  renderTarifTab('inap');
}

async function renderTarifTab(tab){
  const body = document.getElementById('tarifBody');
  if (tab === 'inap') {
    body.innerHTML = `
      <label>Kode Kelas</label><input id="tf_kode" placeholder="KLS3, VIP, ICU">
      <label>Nama Kelas</label><input id="tf_nama">
      <label>Tarif Kamar/Hari</label><input id="tf_kamar" type="number">
      <label>Tarif Visite Umum</label><input id="tf_visu" type="number">
      <label>Tarif Visite Spesialis</label><input id="tf_viss" type="number">
      <label>Tarif Asuhan Keperawatan</label><input id="tf_asuhan" type="number">
      <button class="btn" onclick="tfSubmit('tarif.tambahKelasInap',{kode:val('tf_kode'),nama:val('tf_nama'),tarifKamar:Number(val('tf_kamar'))||0,tarifVisiteUmum:Number(val('tf_visu'))||0,tarifVisiteSpesialis:Number(val('tf_viss'))||0,tarifAsuhanKeperawatan:Number(val('tf_asuhan'))||0},'inap')">Simpan</button>
      <div id="tfList" style="margin-top:14px"></div>`;
    const rows = await api('tarif.listRawatInap', {}, 'POST');
    document.getElementById('tfList').innerHTML = pjTable(rows, ['Kode_Kelas','Nama_Kelas','Tarif_Kamar_Per_Hari','Tarif_Visite_Dokter_Umum','Tarif_Visite_Dokter_Spesialis']);
  } else if (tab === 'jalan') {
    body.innerHTML = `
      <label>Kode Poli</label><input id="tf_kode">
      <label>Nama Poli</label><input id="tf_nama">
      <label>Tarif Konsultasi Umum</label><input id="tf_umum" type="number">
      <label>Tarif Konsultasi Spesialis</label><input id="tf_spesialis" type="number">
      <label>Tarif Administrasi</label><input id="tf_admin" type="number">
      <button class="btn" onclick="tfSubmit('tarif.tambahPoli',{kode:val('tf_kode'),nama:val('tf_nama'),tarifUmum:Number(val('tf_umum'))||0,tarifSpesialis:Number(val('tf_spesialis'))||0,tarifAdministrasi:Number(val('tf_admin'))||0},'jalan')">Simpan</button>
      <div id="tfList" style="margin-top:14px"></div>`;
    const rows = await api('tarif.listRawatJalan', {}, 'POST');
    document.getElementById('tfList').innerHTML = pjTable(rows, ['Kode_Poli','Nama_Poli','Tarif_Konsultasi_Umum','Tarif_Konsultasi_Spesialis']);
  } else if (tab === 'layanan') {
    body.innerHTML = `
      <label>Kode Layanan</label><input id="tf_kode">
      <label>Kategori</label><input id="tf_kategori" placeholder="Lab, Radiologi, Tindakan, Ambulans">
      <label>Nama Layanan</label><input id="tf_nama">
      <label>Satuan</label><input id="tf_satuan" placeholder="Per Tindakan">
      <label>Tarif (Rp)</label><input id="tf_tarif" type="number">
      <button class="btn" onclick="tfSubmit('tarif.tambahLayanan',{kode:val('tf_kode'),kategori:val('tf_kategori'),nama:val('tf_nama'),satuan:val('tf_satuan'),tarif:Number(val('tf_tarif'))||0},'layanan')">Simpan</button>
      <div id="tfList" style="margin-top:14px"></div>`;
    const rows = await api('tarif.listLayanan', {}, 'POST');
    document.getElementById('tfList').innerHTML = pjTable(rows, ['Kode_Layanan','Kategori','Nama_Layanan','Tarif']);
  }
}

async function tfSubmit(action, data, tab){
  const r = await api(action, data, 'POST');
  if (r && r.ok) { toast('Tersimpan'); } else { toast((r && r.error) || 'Gagal menyimpan'); }
  renderTarifTab(tab);
}
render();
</script>
</body>
</html>
