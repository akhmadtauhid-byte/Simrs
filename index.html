/* ===== Saran pasien sambil mengetik (dropdown) untuk kolom No. RM di Unit
   Penunjang — supaya tidak perlu buka menu lain dulu untuk melihat No. RM
   pasien. Ketik No. RM ATAU nama pasien, muncul daftar untuk dipilih. ===== */
let pasienSaranDebounce;
function cariPasienSaran(rmId, boxId, namaId, hintId, opt){
  clearTimeout(pasienSaranDebounce);
  const q = val(rmId).trim();
  const box = document.getElementById(boxId);
  if(!box) return;
  if(q.length < 2){ box.classList.remove("show"); box.innerHTML = ""; return; }
  pasienSaranDebounce = setTimeout(async ()=>{
    const hasil = await api("searchPasien", {q}, "POST");
    if(!hasil || !hasil.length){
      box.innerHTML = `<div class="suggest-item" style="color:var(--muted)">Tidak ada pasien cocok — pastikan sudah terdaftar di menu Pendaftaran</div>`;
      box.classList.add("show");
      return;
    }
    box.innerHTML = hasil.map(p => `<div class="suggest-item" onclick='pilihPasienPenunjang(${JSON.stringify(rmId)}, ${JSON.stringify(boxId)}, ${JSON.stringify(namaId)}, ${JSON.stringify(hintId)}, ${JSON.stringify(opt||{})}, ${JSON.stringify(p.RM)})'><b>${p.RM}</b> — ${p.Nama}${p.NoHP ? ` <span class="hint">(${p.NoHP})</span>` : ""}</div>`).join("");
    box.classList.add("show");
  }, 250);
}
async function pilihPasienPenunjang(rmId, boxId, namaId, hintId, opt, rm){
  document.getElementById(boxId).classList.remove("show");
  document.getElementById(boxId).innerHTML = "";
  document.getElementById(rmId).value = rm;
  await cariPasienOtomatis(rmId, namaId, hintId, opt);
}

/* ===== Cari pasien otomatis berdasarkan No. RM (Lab/Rad/Farmasi/Gizi) =====
   Dibuat karena form-form ini dulu meminta Nama Pasien diketik ULANG manual
   tanpa dicek ke data pasien sungguhan — kadang lupa diisi (nama kosong) atau
   salah ketik. Sekarang begitu No. RM yang benar diketik, Nama Pasien terisi
   otomatis & dikunci (tidak bisa diketik ulang) supaya datanya pasti benar
   bersumber dari catatan pasien, bukan ketikan manual. Untuk Gizi, Alergi &
   saran Ruang/Kelas ikut terisi otomatis kalau pasien sedang rawat inap.
   Untuk Lab/Radiologi, "Unit Asal" ikut disarankan otomatis berdasarkan
   lokasi pasien saat ini (ruangan kalau rawat inap, "IGD" kalau kunjungan
   aktifnya IGD, atau nama poli kalau rawat jalan) — tetap boleh diubah
   manual kalau ternyata beda (mis. sampel dikirim dari unit lain). */
async function cariPasienOtomatis(rmId, namaId, hintId, opt){
  opt = opt || {};
  const rm = val(rmId).trim();
  const namaEl = document.getElementById(namaId);
  const hintEl = hintId ? document.getElementById(hintId) : null;
  const alergiEl = opt.alergiId ? document.getElementById(opt.alergiId) : null;
  if(!rm){
    if(namaEl){ namaEl.readOnly = false; namaEl.style.background = ""; }
    if(alergiEl){ alergiEl.readOnly = false; alergiEl.style.background = ""; }
    if(hintEl) hintEl.textContent = "";
    return;
  }
  const hasil = await api('penunjang.cariPasien', {noRm: rm}, 'POST');
  if(hasil && hasil.ditemukan){
    if(namaEl){ namaEl.value = hasil.namaPasien; namaEl.readOnly = true; namaEl.style.background = "#f5f5f5"; }
    let pesan = "✅ Pasien ditemukan: " + hasil.namaPasien;
    if(alergiEl){
      alergiEl.value = hasil.alergi || "Tidak ada";
      alergiEl.readOnly = true; alergiEl.style.background = "#f5f5f5";
    }
    if(opt.ruangId){
      const ruangEl = document.getElementById(opt.ruangId);
      if(ruangEl){
        if(hasil.sedangRawatInap){
          ruangEl.value = (hasil.ruangan||"") + (hasil.kelas ? (" (Kelas "+hasil.kelas+")") : "") + (hasil.kodeBed ? (" — "+hasil.kodeBed) : "");
          pesan += " — sedang rawat inap di " + (hasil.ruangan||"-");
        } else {
          ruangEl.value = "";
        }
      }
    }
    if(opt.unitAsalId){
      const unitEl = document.getElementById(opt.unitAsalId);
      if(unitEl && hasil.unitAsalSaran){
        unitEl.value = hasil.unitAsalSaran;
        pesan += " — Unit Asal otomatis: " + hasil.unitAsalSaran;
      }
    }
    // BARU: saran otomatis "Dokter Pengirim/Order" dari DPJP kunjungan aktif
    // pasien -- tetap boleh diganti manual (pilih "Lainnya" di dropdown)
    // kalau dokter pengirim beda dari DPJP, atau dokter rujukan luar RS.
    if(opt.dokterSelectId){
      const dokterSel = document.getElementById(opt.dokterSelectId);
      if(dokterSel){
        await isiSelectPegawai(opt.dokterSelectId);
        if(hasil.dpjpId){
          dokterSel.value = hasil.dpjpId;
          if(dokterSel.value !== hasil.dpjpId){ dokterSel.value = "__manual__"; }
          if(opt.dokterManualId) onPegawaiSelectChange(opt.dokterSelectId, opt.dokterManualId);
          pesan += " — Dokter otomatis: " + (hasil.dpjpNama || "(DPJP kunjungan aktif)");
        }
      }
    }
    if(hintEl) hintEl.textContent = pesan;
  } else {
    if(namaEl){ namaEl.value = ""; namaEl.readOnly = false; namaEl.style.background = ""; }
    if(alergiEl){ alergiEl.value = ""; alergiEl.readOnly = false; alergiEl.style.background = ""; }
    if(hintEl) hintEl.textContent = rm.length >= 2 ? "⚠️ No. RM tidak ditemukan — pastikan sudah benar, atau daftarkan pasien dulu di menu Pendaftaran" : "";
  }
}
// Helper untuk form yang punya pilihan "Master Tarif" + pilihan dokter dari
// master pegawai (Lab/Radiologi/Gizi) -- menggabungkan hasil pilihan
// dropdown dokter (ID dari master ATAU nama ketik manual) ke payload sebelum
// dikirim, lalu memanggil pjSubmit seperti biasa. dokterIdField/dokterNamaField
// dibuat bisa diganti karena nama field beda antar unit (fn_lab_insert/
// fn_rad_insert pakai dokterPengirimId/dokterPengirim, fn_gizi_insert pakai
// dokterId/dokter).
async function pjSubmitPenunjangDenganTarif(action, dokterSelectId, dokterManualId, data, dokterIdField, dokterNamaField){
  dokterIdField = dokterIdField || 'dokterPengirimId';
  dokterNamaField = dokterNamaField || 'dokterPengirim';
  if (dokterSelectId) {
    const dokter = pegawaiPayload(dokterSelectId, dokterManualId);
    if (dokter.id) data[dokterIdField] = dokter.id;
    if (dokter.nama) data[dokterNamaField] = dokter.nama;
  }
  if (!data.kodeTarif) delete data.kodeTarif;
  await pjSubmit(action, data);
}
async function pjSubmit(action, data){
  const r = await api(action, data, 'POST');
  if (r && (r.id || r.ok)) {
    if (r.adaPeringatanAlergi && (r.peringatanAlergi||[]).length){
      toast('⚠️ Resep tersimpan, TAPI berpotensi cocok dengan riwayat alergi pasien: ' + r.peringatanAlergi.join('; '));
    } else if (r.peringatan) {
      toast('⚠️ ' + r.peringatan);
    } else {
      toast('Tersimpan' + (r.billingTerbuat ? ' — baris Billing otomatis ikut dibuat' : ''));
    }
  }
  else { toast((r && (r.msg || r.error)) || 'Gagal menyimpan'); }
  const tabMap = { 'lab.buatOrder':'lab','rad.buatOrder':'rad','farmasi.buatResep':'farmasi','gizi.buatOrder':'gizi','cssd.terimaAlat':'cssd','linen.setorKotor':'linen','jenazah.buat':'jenazah' };
  renderPenunjangTab(tabMap[action] || 'lab');
}

function pjTable(rows, cols){
  if (!rows || !rows.length) return '<p class="sub">Belum ada data.</p>';
  return '<table style="width:100%;border-collapse:collapse;font-size:13px">' +
    '<tr>' + cols.map(c => `<th style="text-align:left;padding:6px;border-bottom:1px solid var(--line)">${c}</th>`).join('') + '</tr>' +
    rows.map(r => '<tr>' + cols.map(c => `<td style="padding:6px;border-bottom:1px solid var(--line)">${r[c] ?? ''}</td>`).join('') + '</tr>').join('') +
    '</table>';
}

            <option value="Telepon">Telepon</option>
            <option value="Lisan Langsung">Lisan Langsung</option>
            <option value="Lainnya">Lainnya</option>
          </select>
          <label style="margin-top:8px"><input type="checkbox" id="kritisBacaUlang_${r.ID_Order}"> Sudah dikonfirmasi baca ulang (read-back) oleh penerima</label>
          <label>Catatan Tambahan (opsional)</label>
          <textarea id="kritisCatatan_${r.ID_Order}" placeholder="cth: pasien harus segera dievaluasi ulang"></textarea>

      ` : `<div class="hint" style="margin-top:6px">Belum ada hasil</div>`)}

function toggleFormKritis(orderId){
  const el = document.getElementById('areaKritis_'+orderId);
  const cek = document.getElementById('kritis_'+orderId);
  if(el && cek) el.style.display = cek.checked ? 'block' : 'none';
}
async function isiHasilPemeriksaan(jenis, orderId){
  const hasil = val('hasil_'+orderId);
  if(!hasil){ toast('Isi hasil pemeriksaan dulu'); return; }
  const nilaiKritis = document.getElementById('kritis_'+orderId) ? document.getElementById('kritis_'+orderId).checked : false;
  const payload = {orderId, hasil, nilaiKritis};
  if(nilaiKritis){
    payload.diberitahukanKepada = val('kritisKepada_'+orderId);
    payload.metodePemberitahuan = val('kritisMetode_'+orderId);
    payload.dikonfirmasiBacaUlang = document.getElementById('kritisBacaUlang_'+orderId).checked;
    payload.catatanKritis = val('kritisCatatan_'+orderId);
  }
  const r = await api(jenis+'.isiHasil', payload, 'POST');
  if(r.ok){ toast('Hasil tersimpan'); renderPenunjangTab(jenis); } else toast(r.msg || 'Gagal menyimpan hasil');
}

let resepCart = [];

async function muatObatFavoritQuickPick(){

  if(!dokter.id && !kodePoli){

    window.__favoritQuickPickRows = [];

  el.innerHTML = `<div class="hint">Memuat rekomendasi...</div>`;

  if(!rows.length){
    el.innerHTML = `<div class="hint">Belum ada obat favorit tersimpan untuk dokter/Poli ini — pencarian obat biasa di bawah tetap bisa dipakai seperti biasa. (Kelola template obat di bagian bawah halaman ini.)</div>`;

function tambahFavoritKeKeranjangByIndex(i){
  const r = (window.__favoritQuickPickRows||[])[i];

  resepCart.push({kode:r.kodeObat, nama:r.namaObat, jumlah:1, aturanPakai:r.catatanDosis||''});

function namaDariSelectPegawai(selectId){
  const sel = document.getElementById(selectId);
  if(!sel || !sel.value || sel.value==='__manual__') return '';
  const opt = sel.options[sel.selectedIndex];
  return opt ? opt.textContent.split(' — ')[0] : '';
}
async function submitResepDariKeranjang(){
  if(!resepCart.length){ toast('Keranjang resep masih kosong — tambahkan minimal satu obat dulu'); return; }
  const dokter = pegawaiPayload('pj_dokterId','pj_dokterManual');
  const payload = {
    noRm: val('pj_norm'), namaPasien: val('pj_nama'), petugas: state.user.nama,
    items: resepCart.map(it=>({kode:it.kode, jumlah:it.jumlah, aturanPakai:it.aturanPakai}))
  };
  if(dokter.id){ payload.dokterId = dokter.id; payload.dokter = namaDariSelectPegawai('pj_dokterId'); }
  else if(dokter.nama){ payload.dokter = dokter.nama; }
  const r = await api('farmasi.buatResep', payload, 'POST');
  if(r && (r.id || r.ok)){
    if(r.adaPeringatanAlergi && (r.peringatanAlergi||[]).length){
      toast('⚠️ Resep tersimpan, TAPI berpotensi cocok dengan riwayat alergi pasien: ' + r.peringatanAlergi.join('; '));
    } else {
      toast(`Resep tersimpan (${resepCart.length} item)`);
    }
    resepCart = [];
  } else {
    toast((r && (r.msg || r.error)) || 'Gagal menyimpan resep');
  }
  renderPenunjangTab('farmasi');
}

      </table>
      ${r.adaPeringatanAlergi ? `<div class="flag-item warn" style="margin-top:8px">🚫 Berpotensi cocok dengan riwayat alergi pasien: ${r.peringatanAlergiDetail||"-"}<br><span class="hint">Pencocokan kata kunci sederhana, bukan pengganti verifikasi klinis manual — tetap cek ulang ke pasien/rekam medis.</span></div>` : ""}
      ${(r.status==='Diproses' && bolehKelola) ? `
        ${r.adaObatHighAlert ? `<input id="verKedua_${r.id}" placeholder="Nama petugas KEDUA yang ikut memverifikasi (wajib, obat High-Alert)" style="margin-top:8px">` : ""}
        ${r.adaPeringatanAlergi ? `<textarea id="overrideAlergi_${r.id}" placeholder="Catatan peninjauan alergi (wajib) — mis. sudah dikonfirmasi ke pasien/DPJP, aman dilanjutkan" style="margin-top:8px"></textarea>` : ""}
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sm" onclick="serahkanResep('${r.id}', ${r.adaObatHighAlert?'true':'false'}, ${r.adaPeringatanAlergi?'true':'false'})">✅ Verifikasi &amp; Serahkan</button>
          <button class="btn sm ghost" onclick="tolakResep('${r.id}')">❌ Tolak</button>
        </div>` : ""}

    </div>`).join("");
}
async function serahkanResep(id, adaHighAlert, adaAlergi){
  const payload = {resepId:id};
  if(adaHighAlert){
    const verifikatorKedua = val('verKedua_'+id);
    if(!verifikatorKedua){ toast('Resep ini mengandung obat High-Alert — isi nama petugas kedua dulu'); return; }
    payload.verifikatorKedua = verifikatorKedua;
  }
  if(adaAlergi){
    const catatanOverrideAlergi = val('overrideAlergi_'+id);
    if(!catatanOverrideAlergi){ toast('Resep ini berpotensi cocok dengan alergi pasien — isi catatan peninjauan dulu'); return; }
    payload.catatanOverrideAlergi = catatanOverrideAlergi;
  }
  const r = await api('farmasi.serahkanResep', payload, 'POST');
  if(r.ok){ toast(r.msg || 'Resep diserahkan'); renderPenunjangTab('farmasi'); } else toast(r.msg || 'Gagal menyerahkan resep');
}
async function tolakResep(id){
  const alasan = prompt('Alasan penolakan resep ini:');
  if(alasan === null) return;
  if(!alasan.trim()){ toast('Alasan penolakan wajib diisi'); return; }
  const r = await api('farmasi.tolakResep', {resepId:id, alasan}, 'POST');
  if(r.ok){ toast('Resep ditolak'); renderPenunjangTab('farmasi'); } else toast(r.msg || 'Gagal menolak resep');
}

/* ============ KAMAR OPERASI (Jadwal Operasi + Checklist Keselamatan Operasi 3 fase) ============
   Sesuai standar WHO Surgical Safety Checklist: Sign In (sebelum induksi
   anestesi), Time Out (sebelum insisi), Sign Out (sebelum pasien keluar OK).
   Setiap fase HANYA bisa diisi SEKALI dan tidak bisa diubah setelah
   tersimpan (dokumen keselamatan pasien, sama seperti dokumen legal lain). */
const CHECKLIST_OPERASI_ITEM = {
  "Sign In": [
    ["identitasPasienDikonfirmasi", "Identitas pasien, lokasi operasi & prosedur sudah dikonfirmasi (oleh pasien sendiri kalau memungkinkan)"],
    ["lokasiTindakanDitandai", "Lokasi tindakan sudah ditandai (site marking) atau tidak diperlukan penandaan"],
    ["obatMesinAnestesiDicek", "Mesin & obat-obatan anestesi sudah dicek lengkap"],
    ["pulseOximeterTerpasang", "Pulse oximeter terpasang & berfungsi pada pasien"],
    ["alergiDiketahui", "Riwayat alergi pasien sudah diketahui tim"],
  ],
  "Time Out": [
    ["timTelahMemperkenalkanDiri", "Seluruh anggota tim sudah memperkenalkan nama & perannya"],
    ["identitasLokasiProsedurDikonfirmasiTim", "Identitas pasien, lokasi, & prosedur dikonfirmasi ulang oleh seluruh tim (dokter, anestesi, perawat)"],
    ["antibiotikProfilaksisDiberikan", "Antibiotik profilaksis sudah diberikan dalam 60 menit terakhir, atau tidak diperlukan"],
    ["antisipasiKejadianKritisDidiskusikan", "Antisipasi kejadian kritis (kehilangan darah, kesulitan alat, dll) sudah didiskusikan tim"],
  ],
  "Sign Out": [
    ["namaProsedurDicatat", "Nama prosedur/tindakan yang dilakukan sudah dicatat"],
    ["instrumenKasaJarumLengkap", "Jumlah instrumen, kasa & jarum sudah dihitung lengkap (tidak ada yang tertinggal)"],
    ["spesimenDiberiLabel", "Spesimen (kalau ada) sudah diberi label dengan benar, atau tidak ada spesimen"],
    ["instruksiPemulihanDisampaikan", "Instruksi pemulihan/perawatan pasca operasi sudah disampaikan ke tim ruangan"],
  ],
};

  const now = new Date();
  document.getElementById("joDari").value = now.toISOString().slice(0,10);
  document.getElementById("joSampai").value = new Date(now.getTime() + 14*86400000).toISOString().slice(0,10);

async function submitJadwalOperasi(){
  if(!val("joKunjunganId")){ toast("No. Kunjungan wajib diisi"); return; }
  if(!val("joNamaTindakan")){ toast("Nama tindakan operasi wajib diisi"); return; }
  if(!val("joTanggal")){ toast("Tanggal operasi wajib diisi"); return; }
  if(!val("joRuang")){ toast("Ruang operasi wajib diisi"); return; }
  const operatorPilih = pegawaiPayload("joOperatorId","joOperatorManual");
  const anestesiPilih = pegawaiPayload("joAnestesiId","joAnestesiManual");
  const r = await api("operasi.jadwalTambah", {
    kunjunganId: val("joKunjunganId"), namaTindakanOperasi: val("joNamaTindakan"),
    dokterOperatorId: operatorPilih.id, dokterOperator: operatorPilih.nama,
    dokterAnestesiId: anestesiPilih.id, dokterAnestesi: anestesiPilih.nama,
    jenisAnestesi: val("joJenisAnestesi"), timLain: val("joTimLain"),
    tanggalOperasi: val("joTanggal"), jamMulai: val("joJam"), ruangOperasi: val("joRuang"),
    catatan: val("joCatatan")
  }, "POST");
  if(r.ok){
    toast("Jadwal operasi tersimpan");
    document.getElementById("hasilJadwalOperasi").innerHTML = `✅ Jadwal operasi tersimpan.`;
    ["joNamaTindakan","joTimLain","joCatatan"].forEach(id=>document.getElementById(id).value = "");
    await muatJadwalOperasi();
  } else toast(r.msg || "Gagal menyimpan jadwal operasi");
}
async function muatJadwalOperasi(){
  const box = document.getElementById("jadwalOperasiList");
  if(!box) return;
  box.innerHTML = "Memuat...";
  const bolehKelola = state.user.role === 'admin' || state.user.role === 'rekam_medis' || (state.user.modul||[]).includes('ok');
  const rows = await api("operasi.jadwalList", {dari: val("joDari"), sampai: val("joSampai")}, "POST");
  if(!rows || !rows.length){ box.innerHTML = `<div class="empty">Tidak ada jadwal operasi pada periode ini.</div>`; return; }
  const statusBadge = {Dijadwalkan:"warn", Selesai:"ok", Dibatalkan:"danger"};
  box.innerHTML = rows.map(jo => `
    <div class="card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">
        <div><b>${jo.namaTindakanOperasi}</b> — ${jo.namaPasien} (RM ${jo.noRm})</div>
        <span class="badge ${statusBadge[jo.status]||'muted'}">${jo.status}</span>
      </div>
      <div class="hint" style="margin-top:4px">
        ${new Date(jo.tanggalOperasi).toLocaleDateString('id-ID')}${jo.jamMulai ? (' '+jo.jamMulai) : ''} · Ruang ${jo.ruangOperasi} ·
        Operator: ${jo.dokterOperator}${jo.dokterAnestesi ? (' · Anestesi: '+jo.dokterAnestesi) : ''}${jo.jenisAnestesi ? (' ('+jo.jenisAnestesi+')') : ''}
      </div>
      ${jo.catatan ? `<div class="hint">Catatan: ${jo.catatan}</div>` : ""}
      ${bolehKelola && jo.status === 'Dijadwalkan' ? `
        <div class="row" style="margin-top:6px">
          <button class="btn sm" onclick="submitStatusJadwalOperasi('${jo.id}','Selesai')">Tandai Selesai</button>
          <button class="btn sm danger" onclick="submitStatusJadwalOperasi('${jo.id}','Dibatalkan')">Batalkan</button>
        </div>` : ""}
      <div class="section-title" style="margin-top:10px;font-size:13px">Checklist Keselamatan Operasi</div>
      ${renderChecklistOperasi(jo, bolehKelola)}
    </div>`).join("");
}
async function submitStatusJadwalOperasi(id, status){
  const r = await api("operasi.jadwalSetStatus", {id, status}, "POST");
  if(r.ok){ toast("Status jadwal diperbarui"); await muatJadwalOperasi(); } else toast(r.msg || "Gagal mengubah status");
}
function renderChecklistOperasi(jo, bolehKelola){
  const sudah = {}; (jo.checklist||[]).forEach(c => sudah[c.fase] = c);
  return ["Sign In","Time Out","Sign Out"].map(fase => {
    const c = sudah[fase];
    if(c){
      return `<div class="flag-item ${c.semuaTerkonfirmasi ? 'ok' : 'warn'}" style="margin-top:6px">
        <b>${fase}</b> — ✔️ Sudah diisi oleh ${c.dicatatOleh||'-'}${c.profesiPencatat ? (' ('+c.profesiPencatat+')') : ''} pada ${new Date(c.waktu).toLocaleString('id-ID')}.
        ${!c.semuaTerkonfirmasi ? `<br>⚠️ Ada item yang belum bisa dikonfirmasi. Catatan: ${c.catatan||'-'}` : ''}
      </div>`;
    }
    if(!bolehKelola){
      return `<div class="hint" style="margin-top:6px">${fase}: belum diisi.</div>`;
    }
    const items = CHECKLIST_OPERASI_ITEM[fase];
    const faseId = fase.replace(/\s/g,'');
    return `<div class="card" style="margin-top:6px;background:#fafafa">
      <b>${fase}</b> — belum diisi
      ${items.map(([key,label]) => `<div style="margin-top:6px"><label style="font-weight:normal;font-size:13px">${label}</label>
        <div style="display:flex;gap:14px;margin-top:2px">
          <label style="font-weight:normal;display:flex;align-items:center;gap:4px"><input type="radio" name="chk_${jo.id}_${faseId}_${key}" value="ya" onchange="cekItemChecklistOperasi('${jo.id}','${faseId}')"> Ya</label>
          <label style="font-weight:normal;display:flex;align-items:center;gap:4px"><input type="radio" name="chk_${jo.id}_${faseId}_${key}" value="tidak" onchange="cekItemChecklistOperasi('${jo.id}','${faseId}')"> Tidak</label>
        </div></div>`).join("")}
      <label style="margin-top:6px">Catatan (wajib diisi kalau ada jawaban "Tidak")</label>
      <textarea id="chkCatatan_${jo.id}_${faseId}"></textarea>
      <button class="btn sm" style="margin-top:6px" onclick="submitChecklistOperasi('${jo.id}','${fase}')">Simpan Checklist ${fase}</button>
    </div>`;
  }).join("");
}
function cekItemChecklistOperasi(joId, faseId){ /* placeholder hook kalau nanti perlu validasi live; saat ini validasi cukup di submit */ }
async function submitChecklistOperasi(joId, fase){
  const faseId = fase.replace(/\s/g,'');
  const items = CHECKLIST_OPERASI_ITEM[fase];
  const itemDicek = {};
  for(const [key,label] of items){
    const checked = document.querySelector(`input[name="chk_${joId}_${faseId}_${key}"]:checked`);
    if(!checked){ toast(`Item "${label}" wajib dijawab Ya/Tidak`); return; }
    itemDicek[key] = checked.value === "ya";
  }
  const catatan = document.getElementById(`chkCatatan_${joId}_${faseId}`).value.trim();
  const r = await api("operasi.checklistSimpan", {jadwalOperasiId: joId, fase, itemDicek, catatan}, "POST");
  if(r.ok){ toast(`Checklist ${fase} tersimpan`); await muatJadwalOperasi(); } else toast(r.msg || "Gagal menyimpan checklist");
}

function batalEditJadwalJaga(){

  document.getElementById("jj_f_peran").value = "";

async function submitJadwalJaga(){
  const id = val('jj_id');
  const pegawai = pegawaiPayload('jj_f_pegawaiId','jj_f_pegawaiManual');
  const payload = {
    tanggal: val('jj_f_tanggal'), shift: val('jj_f_shift'), unitPoli: val('jj_f_unit'),
    pegawaiId: pegawai.id, nama: pegawai.nama, peran: val('jj_f_peran'), catatan: val('jj_f_catatan')
  };
  const r = id ? await api('jadwalJaga.ubah', {id, ...payload}, 'POST') : await api('jadwalJaga.tambah', payload, 'POST');
  if(r.ok){ toast(id ? 'Jadwal jaga diperbarui' : 'Jadwal jaga ditambahkan'); batalEditJadwalJaga(); await muatJadwalJaga(); }
  else toast(r.msg || 'Gagal menyimpan jadwal jaga');

async function hapusJadwalJaga(id){
  if(!confirm('Hapus jadwal jaga ini?')) return;
  const r = await api('jadwalJaga.hapus', {id}, 'POST');
  if(r.ok){ toast('Jadwal jaga dihapus'); await muatJadwalJaga(); } else toast(r.msg || 'Gagal menghapus jadwal jaga');
}

async function pagePpi(el){
  const bolehCatat = state.user.role === 'admin' || (state.user.modul||[]).includes('ppi') || (state.user.modul||[]).includes('mutu');
  el.innerHTML = `<h1>🦠 Surveilans Infeksi RS (PPI)</h1><p class="sub">Pencatatan infeksi terkait pelayanan kesehatan (HAIs) — Plebitis, ISK, IDO, Dekubitus, VAP, dll.</p>
    <div class="card" style="margin-bottom:12px">
      <div class="row">

        <div><label>Sampai Tanggal</label><input id="ppi_sampai" type="date"></div>
        <div><label>Jenis Infeksi (opsional)</label><select id="ppi_jenis"><option value="">Semua</option>${DAFTAR_JENIS_INFEKSI.map(j=>`<option>${j}</option>`).join("")}</select></div>
        <div style="align-self:flex-end"><button class="btn sm" onclick="muatPpi()">Tampilkan</button></div>
      </div>
    </div>

    ${bolehCatat ? `<div class="card" style="margin-bottom:12px">
      <div class="section-title" id="ppiFormTitle">Catat Infeksi Baru</div>
      <input type="hidden" id="ppi_id">
      <label>No. Kunjungan (cth: KJ00001)</label><input id="ppi_f_kunjunganId" placeholder="Nomor kunjungan pasien">
      <label>Jenis Infeksi</label><select id="ppi_f_jenis">${DAFTAR_JENIS_INFEKSI.map(j=>`<option>${j}</option>`).join("")}</select>
      <label>Tanggal Ditemukan</label><input id="ppi_f_tanggal" type="date">
      <label>Lokasi Infeksi</label><input id="ppi_f_lokasi" placeholder="cth: IV line tangan kanan">
      <label>Faktor Risiko</label><input id="ppi_f_risiko" placeholder="cth: Pemasangan infus lama">
      <label>Tindak Lanjut</label><input id="ppi_f_tindakan" placeholder="cth: Ganti lokasi infus, edukasi">
      <div style="margin-top:8px;display:flex;gap:8px">
        <button class="btn sm" onclick="submitPpi()">Simpan</button>
        <button class="btn sm ghost" onclick="batalEditPpi()">Batal Ubah</button>
      </div>
    </div>` : ""}
    <div id="ppiList"></div>`;
  const now = new Date();
  document.getElementById("ppi_dari").value = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
  document.getElementById("ppi_sampai").value = now.toISOString().slice(0,10);
  if(bolehCatat) document.getElementById("ppi_f_tanggal").value = now.toISOString().slice(0,10);
  await muatPpi();
}
async function muatPpi(){
  const box = document.getElementById('ppiList');
  const rekapBox = document.getElementById('ppiRekap');
  if(!box) return;
  const bolehCatat = state.user.role === 'admin' || (state.user.modul||[]).includes('ppi') || (state.user.modul||[]).includes('mutu');
  const dari = val('ppi_dari'), sampai = val('ppi_sampai'), jenis = val('ppi_jenis');
  const rekap = await api('ppi.rekap', {dari, sampai}, 'GET');
  if(rekap && rekap.ok){
    rekapBox.innerHTML = `<div class="section-title">Rekap Periode ${new Date(rekap.dari).toLocaleDateString('id-ID')} — ${new Date(rekap.sampai).toLocaleDateString('id-ID')}</div>
      <div class="row">
        <div><b>${rekap.totalInfeksi}</b><div class="hint">Total kasus infeksi</div></div>
        <div><b>${rekap.hariRawatPeriode}</b><div class="hint">Hari rawat (patient-days)</div></div>
        <div><b>${rekap.insidensPer1000HariRawat ?? '-'}</b><div class="hint">Insidens per 1000 hari rawat</div></div>
      </div>
      ${rekap.perJenis && rekap.perJenis.length ? `<table style="margin-top:8px"><tr><th>Jenis Infeksi</th><th>Jumlah</th></tr>
        ${rekap.perJenis.map(j=>`<tr><td>${j.jenisInfeksi}</td><td>${j.jumlah}</td></tr>`).join("")}</table>` : '<div class="hint">Belum ada kasus pada periode ini.</div>'}`;
  } else { rekapBox.innerHTML = `<div class="empty">${(rekap&&rekap.msg)||'Gagal memuat rekap'}</div>`; }

  const rows = await api('ppi.list', {dari, sampai, jenisInfeksi: jenis||undefined}, 'GET');
  if(!rows || !rows.length){ box.innerHTML = `<div class="card empty">Tidak ada catatan infeksi pada periode ini.</div>`; return; }
  box.innerHTML = `<div class="card"><table>
    <tr><th>Tanggal</th><th>No. RM</th><th>Pasien</th><th>Jenis Infeksi</th><th>Hari Rawat Ke</th><th>Lokasi</th><th>Faktor Risiko</th><th>Tindak Lanjut</th><th>Dilaporkan Oleh</th>${bolehCatat?'<th></th>':''}</tr>
    ${rows.map(r=>`<tr>
      <td>${new Date(r.tanggalDitemukan).toLocaleDateString('id-ID')}</td><td>${r.noRm}</td><td>${r.namaPasien}</td>
      <td><span class="badge warn">${r.jenisInfeksi}</span></td><td>${r.hariRawatKe ?? '-'}</td>
      <td>${r.lokasiInfeksi||'-'}</td><td>${r.faktorRisiko||'-'}</td><td>${r.tindakanLanjut||'-'}</td><td>${r.dilaporkanOleh||'-'}</td>
      ${bolehCatat ? `<td><button class="btn sm ghost" onclick='mulaiEditPpi(${JSON.stringify(r).replace(/'/g,"&#39;")})'>✏️</button></td>` : ''}
    </tr>`).join("")}
  </table></div>`;
}
function mulaiEditPpi(r){
  document.getElementById("ppiFormTitle").textContent = "Ubah Catatan Infeksi";
  document.getElementById("ppi_id").value = r.id;
  document.getElementById("ppi_f_kunjunganId").value = "";
  document.getElementById("ppi_f_kunjunganId").disabled = true;
  document.getElementById("ppi_f_jenis").value = r.jenisInfeksi;
  document.getElementById("ppi_f_jenis").disabled = true;
  document.getElementById("ppi_f_tanggal").disabled = true;
  document.getElementById("ppi_f_lokasi").value = r.lokasiInfeksi || "";
  document.getElementById("ppi_f_risiko").value = r.faktorRisiko || "";
  document.getElementById("ppi_f_tindakan").value = r.tindakanLanjut || "";
  window.scrollTo(0,0);
}
function batalEditPpi(){
  document.getElementById("ppiFormTitle").textContent = "Catat Infeksi Baru";
  document.getElementById("ppi_id").value = "";
  document.getElementById("ppi_f_kunjunganId").value = "";
  document.getElementById("ppi_f_kunjunganId").disabled = false;
  document.getElementById("ppi_f_jenis").disabled = false;
  document.getElementById("ppi_f_tanggal").disabled = false;
  document.getElementById("ppi_f_lokasi").value = "";
  document.getElementById("ppi_f_risiko").value = "";
  document.getElementById("ppi_f_tindakan").value = "";
}
async function submitPpi(){
  const id = val('ppi_id');
  if(id){
    const r = await api('ppi.update', {id, lokasiInfeksi: val('ppi_f_lokasi'), faktorRisiko: val('ppi_f_risiko'), tindakanLanjut: val('ppi_f_tindakan')}, 'POST');
    if(r.ok){ toast('Catatan diperbarui'); batalEditPpi(); await muatPpi(); } else toast(r.msg || 'Gagal memperbarui catatan');
    return;
  }
  if(!val('ppi_f_kunjunganId')){ toast('No. Kunjungan wajib diisi'); return; }
  const r = await api('ppi.catat', {
    kunjunganId: val('ppi_f_kunjunganId'), jenisInfeksi: val('ppi_f_jenis'), tanggalDitemukan: val('ppi_f_tanggal'),
    lokasiInfeksi: val('ppi_f_lokasi'), faktorRisiko: val('ppi_f_risiko'), tindakanLanjut: val('ppi_f_tindakan')
  }, 'POST');
  if(r.ok){ toast('Catatan infeksi disimpan'); batalEditPpi(); await muatPpi(); } else toast(r.msg || 'Gagal menyimpan catatan');
}

function badgeStatusKalibrasi(s){
  if(s === 'Aman') return `<span class="badge ok">Aman</span>`;
  if(s === 'Akan Jatuh Tempo') return `<span class="badge warn">Akan Jatuh Tempo</span>`;
  if(s === 'Jatuh Tempo') return `<span class="badge danger">Jatuh Tempo</span>`;
  return `<span class="badge muted">Belum Pernah Kalibrasi</span>`;
}
async function muatAlatMedis(){
  const box = document.getElementById('alatMedisList');
  if(!box) return;
  const bolehKelola = state.user.role === 'admin' || (state.user.modul||[]).includes('alatmedis');
  const rows = await api('alatMedis.list', {status: val('am_filter_status')||undefined}, 'GET');
  window.__alatMedisCache = rows || [];
  if(bolehKelola){
    const sel = document.getElementById('am_k_alatId');
    if(sel) sel.innerHTML = (rows||[]).map(a=>`<option value="${a.id}">${a.kodeAlat} — ${a.namaAlat}</option>`).join("") || `<option value="">Belum ada alat</option>`;
  }
  if(!rows || !rows.length){ box.innerHTML = `<div class="card empty">Belum ada alat medis terdaftar.</div>`; return; }
  box.innerHTML = `<div class="card"><table>
    <tr><th>Kode</th><th>Nama Alat</th><th>Lokasi</th><th>Status</th><th>Kalibrasi Terakhir</th><th>Kalibrasi Berikutnya</th><th>Status Kalibrasi</th><th></th></tr>
    ${rows.map(a=>`<tr>
      <td>${a.kodeAlat}</td><td>${a.namaAlat}</td><td>${a.lokasi||'-'}</td>
      <td><span class="badge ${a.status==='Baik'?'ok':(a.status==='Rusak'?'danger':'warn')}">${a.status}</span></td>
      <td>${a.tanggalKalibrasiTerakhir ? new Date(a.tanggalKalibrasiTerakhir).toLocaleDateString('id-ID') : '-'}</td>
      <td>${a.tanggalKalibrasiBerikutnya ? new Date(a.tanggalKalibrasiBerikutnya).toLocaleDateString('id-ID') : '-'}</td>
      <td>${badgeStatusKalibrasi(a.statusKalibrasi)}</td>
      <td><button class="btn sm ghost" onclick="lihatRiwayatKalibrasi('${a.id}','${(a.namaAlat||'').replace(/'/g,"&#39;")}')">📜 Riwayat</button></td>

}
async function submitTambahAlatMedis(){
  if(!val('am_f_kode') || !val('am_f_nama')){ toast('Kode & Nama Alat wajib diisi'); return; }
  const r = await api('alatMedis.tambah', {
    kodeAlat: val('am_f_kode'), namaAlat: val('am_f_nama'), lokasi: val('am_f_lokasi'),
    intervalKalibrasiBulan: val('am_f_interval'), keterangan: val('am_f_ket')
  }, 'POST');
  if(r.ok){
    toast('Alat medis ditambahkan');
    ['am_f_kode','am_f_nama','am_f_lokasi','am_f_ket'].forEach(id=>document.getElementById(id).value='');

}

  document.getElementById("rl_sampai").value = now.toISOString().slice(0,10);
  await muatRlProfil();
  await muatLaporanRl();
}
async function muatRlProfil(){
  const box = document.getElementById('rlProfilBox');
  const bolehUbah = state.user.role === 'admin';
  const r = await api('rl.profilGet', {}, 'GET');
  const p = r || {};
  box.innerHTML = `
    <div class="row">
      <div><label>Nama RS</label><input id="rlp_namaRs" value="${p.namaRs||''}" ${bolehUbah?'':'disabled'}></div>
      <div><label>Kode RS</label><input id="rlp_kodeRs" value="${p.kodeRs||''}" ${bolehUbah?'':'disabled'}></div>
      <div><label>Kelas RS</label><input id="rlp_kelasRs" value="${p.kelasRs||''}" ${bolehUbah?'':'disabled'}></div>
    </div>
    <div class="row">
      <div><label>Jenis RS</label><input id="rlp_jenisRs" value="${p.jenisRs||''}" ${bolehUbah?'':'disabled'}></div>
      <div><label>Kepemilikan</label><input id="rlp_kepemilikan" value="${p.kepemilikan||''}" ${bolehUbah?'':'disabled'}></div>
      <div><label>Jumlah TT Total</label><input id="rlp_jumlahTt" type="number" value="${p.jumlahTtTotal||''}" ${bolehUbah?'':'disabled'}></div>
    </div>
    <label>Alamat</label><input id="rlp_alamat" value="${p.alamat||''}" ${bolehUbah?'':'disabled'}>
    <div class="row">
      <div><label>Kabupaten/Kota</label><input id="rlp_kabkota" value="${p.kabupatenKota||''}" ${bolehUbah?'':'disabled'}></div>
      <div><label>Provinsi</label><input id="rlp_provinsi" value="${p.provinsi||''}" ${bolehUbah?'':'disabled'}></div>
    </div>
    <div class="row">
      <div><label>No. Izin Operasional</label><input id="rlp_noizin" value="${p.noIzinOperasional||''}" ${bolehUbah?'':'disabled'}></div>
      <div><label>Direktur</label><input id="rlp_direktur" value="${p.direktur||''}" ${bolehUbah?'':'disabled'}></div>
    </div>
    ${bolehUbah ? `<button class="btn sm" style="margin-top:8px" onclick="simpanRlProfil()">Simpan Profil</button>` : `<p class="hint">Hanya admin yang bisa mengubah profil dasar RS.</p>`}`;
}
async function simpanRlProfil(){
  const r = await api('rl.profilSimpan', {
    namaRs: val('rlp_namaRs'), kodeRs: val('rlp_kodeRs'), kelasRs: val('rlp_kelasRs'), jenisRs: val('rlp_jenisRs'),
    kepemilikan: val('rlp_kepemilikan'), jumlahTtTotal: val('rlp_jumlahTt'), alamat: val('rlp_alamat'),
    kabupatenKota: val('rlp_kabkota'), provinsi: val('rlp_provinsi'), noIzinOperasional: val('rlp_noizin'), direktur: val('rlp_direktur')
  }, 'POST');
  if(r.ok){ toast('Profil RS disimpan'); await muatRlProfil(); } else toast(r.msg || 'Gagal menyimpan profil RS');
}
async function muatLaporanRl(){
  await Promise.all([muatRl3(), muatRl4(), muatRl5()]);
}
async function muatRl3(){
  const box = document.getElementById('rl3Box'); if(!box) return;
  const r = await api('rl.laporanRawatInap', {dari: val('rl_dari'), sampai: val('rl_sampai')}, 'GET');
  if(!r || !r.ok){ box.innerHTML = `<div class="empty">${(r&&r.msg)||'Gagal memuat RL3'}</div>`; return; }
  box.innerHTML = `<div class="section-title">RL3 — Indikator Pelayanan Rawat Inap</div>
    <div class="row">
      <div><b>${r.bor ?? '-'}%</b><div class="hint">BOR</div></div>
      <div><b>${r.avlos ?? '-'}</b><div class="hint">AvLOS (hari)</div></div>
      <div><b>${r.toi ?? '-'}</b><div class="hint">TOI (hari)</div></div>
      <div><b>${r.bto ?? '-'}</b><div class="hint">BTO (kali)</div></div>
      <div><b>${r.ndr ?? '-'}</b><div class="hint">NDR (‰)</div></div>
      <div><b>${r.gdr ?? '-'}</b><div class="hint">GDR (‰)</div></div>
    </div>
    <p class="hint">Tempat tidur tersedia: ${r.tempatTidurTersedia} · Pasien masuk: ${r.pasienMasuk} · Pasien keluar total: ${r.pasienKeluarTotal} (hidup: ${r.pasienKeluarHidup}, meninggal &lt;48j: ${r.pasienMatiKurang48Jam}, meninggal ≥48j: ${r.pasienMatiLebih48Jam}) · Hari perawatan: ${r.hariPerawatan}</p>`;
}
async function muatRl4(){
  const box = document.getElementById('rl4Box'); if(!box) return;
  const r = await api('rl.laporanMorbiditas', {dari: val('rl_dari'), sampai: val('rl_sampai'), jenisKunjungan: val('rl4_jenis')}, 'GET');
  if(!r || !r.ok){ box.innerHTML = `<div class="empty">${(r&&r.msg)||'Gagal memuat RL4'}</div>`; return; }
  if(!r.data || !r.data.length){ box.innerHTML = `<div class="empty">Tidak ada data diagnosa pada periode ini.</div>`; return; }
  box.innerHTML = `<table><tr><th>Kode ICD-10</th><th>Diagnosa</th><th>Total</th><th>Rincian Golongan Umur × Jenis Kelamin</th></tr>
    ${r.data.map(d=>`<tr>
      <td>${d.kodeICD10}</td><td>${d.deskripsi}</td><td><b>${d.total}</b></td>
      <td>${d.rincian.map(x=>`${x.golonganUmur}: L${x.lakiLaki}/P${x.perempuan}`).join(', ')}</td>
    </tr>`).join("")}
  </table>`;
}
async function muatRl5(){
  const box = document.getElementById('rl5Box'); if(!box) return;
  const r = await api('rl.laporanKunjungan', {dari: val('rl_dari'), sampai: val('rl_sampai')}, 'GET');
  if(!r || !r.ok){ box.innerHTML = `<div class="empty">${(r&&r.msg)||'Gagal memuat RL5'}</div>`; return; }
  box.innerHTML = `<div class="section-title">RL5 — Rekap Kunjungan</div>
    <div class="row">
      <div><b>Per Jenis Kunjungan</b><br>${(r.totalPerJenisKunjungan||[]).map(x=>`${x.jenisKunjungan}: ${x.jumlah}`).join('<br>') || '-'}</div>
      <div><b>Per Cara Bayar</b><br>${(r.totalPerCaraBayar||[]).map(x=>`${x.caraBayar}: ${x.jumlah}`).join('<br>') || '-'}</div>
      <div><b>Rawat Jalan Baru/Lama</b><br>Baru: ${r.rawatJalanBaruLama?.pasienBaru ?? 0}<br>Lama: ${r.rawatJalanBaruLama?.pasienLama ?? 0}</div>
    </div>`;
}

/* ================= PENGATURAN & LOG NOTIFIKASI WHATSAPP (admin) ================= */
async function pageWaPengaturan(){
  const m = document.getElementById("main");
  m.innerHTML = `<h1>📱 Notifikasi WhatsApp</h1>
    <p class="sub">Kirim notifikasi WA otomatis ke pasien saat nomor antrian dipanggil atau hasil lab siap. Pengiriman sungguhan dilakukan Supabase Edge Function terpisah (lihat panduan) — halaman ini hanya mengatur & memantau antrean pesan.</p>
    <button class="btn ghost" style="margin-bottom:14px" onclick="goTo('dashboard')">← Kembali ke Dashboard</button>
    <div class="card" style="margin-bottom:12px" id="waPengaturanBox">Memuat...</div>
    <div class="card">
      <div class="section-title">Log Pengiriman WhatsApp</div>
      <select id="wa_filter_status" onchange="muatWaLog()"><option value="">Semua Status</option><option>Menunggu</option><option>Terkirim</option><option>Gagal</option></select>
      <div id="waLogBox" style="margin-top:8px"></div>
    </div>`;
  await muatWaPengaturan();
  await muatWaLog();
}
async function muatWaPengaturan(){
  const box = document.getElementById('waPengaturanBox'); if(!box) return;
  const r = await api('wa.pengaturanGet', {}, 'GET');
  if(!r || !r.ok){ box.innerHTML = `<div class="empty">${(r&&r.msg)||'Gagal memuat pengaturan'}</div>`; return; }
  const p = r.data;
  box.innerHTML = `<div class="section-title">Pengaturan</div>
    <label><input type="checkbox" id="wa_aktif" ${p.aktif?'checked':''} style="width:auto"> Aktifkan pengiriman notifikasi WhatsApp</label>
    <label>Provider</label><select id="wa_provider"><option value="fonnte" ${p.provider==='fonnte'?'selected':''}>Fonnte</option><option value="wablas" ${p.provider==='wablas'?'selected':''}>Wablas</option></select>
    <label>API URL</label><input id="wa_apiUrl" value="${p.apiUrl||''}" placeholder="cth: https://api.fonnte.com/send">
    <label>API Token</label><input id="wa_apiToken" value="${p.apiToken||''}" placeholder="Token dari provider WA Anda">
    <p class="hint">⚠️ Token disimpan sebagai teks biasa (bukan terenkripsi) — hanya bisa dibaca/diubah admin.</p>
    <label>Template Pesan — Antrian Dipanggil</label><input id="wa_tplAntrian" value="${(p.templateAntrianDipanggil||'').replace(/"/g,'&quot;')}">
    <p class="hint">Placeholder tersedia: {noAntrian}, {poliRuangan}</p>
    <label>Template Pesan — Hasil Lab Siap</label><input id="wa_tplLab" value="${(p.templateHasilLabSiap||'').replace(/"/g,'&quot;')}">
    <p class="hint">Placeholder tersedia: {noRm}</p>
    <button class="btn sm" style="margin-top:8px" onclick="simpanWaPengaturan()">Simpan Pengaturan</button>`;
}
async function simpanWaPengaturan(){
  const r = await api('wa.pengaturanSimpan', {
    aktif: document.getElementById('wa_aktif').checked, provider: val('wa_provider'),
    apiUrl: val('wa_apiUrl'), apiToken: val('wa_apiToken'),
    templateAntrianDipanggil: val('wa_tplAntrian'), templateHasilLabSiap: val('wa_tplLab')
  }, 'POST');
  if(r.ok){ toast('Pengaturan WhatsApp disimpan'); await muatWaPengaturan(); } else toast(r.msg || 'Gagal menyimpan pengaturan');
}
async function muatWaLog(){
  const box = document.getElementById('waLogBox'); if(!box) return;
  const rows = await api('wa.log', {status: val('wa_filter_status')||undefined}, 'GET');
  if(!rows || !rows.length){ box.innerHTML = `<div class="empty">Belum ada pesan WhatsApp diantre.</div>`; return; }
  box.innerHTML = `<table><tr><th>Waktu</th><th>Kunjungan</th><th>No. HP</th><th>Jenis</th><th>Pesan</th><th>Status</th><th>Error</th><th></th></tr>
    ${rows.map(w=>`<tr>
      <td>${new Date(w.dibuatPada).toLocaleString('id-ID')}</td><td>${w.kunjunganId||'-'}</td><td>${w.noHp}</td><td>${w.jenis}</td>
      <td>${w.pesan}</td>
      <td><span class="badge ${w.status==='Terkirim'?'ok':(w.status==='Gagal'?'danger':'warn')}">${w.status}</span></td>
      <td>${w.errorPesan||'-'}</td>
      <td>${w.status==='Gagal' ? `<button class="btn sm ghost" onclick="kirimUlangWa('${w.id}')">🔁 Kirim Ulang</button>` : ''}</td>
    </tr>`).join("")}
  </table>`;
}
async function kirimUlangWa(id){
  const r = await api('wa.kirimUlang', {id}, 'POST');
  if(r.ok){ toast('Pesan diantre ulang untuk dikirim'); await muatWaLog(); } else toast(r.msg || 'Gagal mengirim ulang');
}

render();
</script>
</body>
</html>
